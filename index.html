<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f120d">
<title>Para ti</title>
<style>
:root{
  --cacao:#1f120d; --cacao2:#2b1a14; --tierra:#6b4a35; --ambar:#c98a3a;
  --crema:#f4e6d0; --suave:#cdb79a;
  --dorado:#e6b450; --rosa:#f0a3b8; --mor:#bda0e6;
  --acento:var(--dorado);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
#app[data-mov="cielito"]{--acento:var(--rosa)}
#app[data-mov="negrita"]{--acento:var(--mor)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cacao);color:var(--crema);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
#app{display:grid;grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto;min-height:100dvh;grid-template-rows:auto 1fr}
.stage{position:relative;width:100%;aspect-ratio:400/440;container-type:inline-size;background:var(--cacao);overflow:hidden;touch-action:manipulation}
.stage svg{display:block;width:100%;height:100%}
.panel{padding:18px 20px 0;background:var(--cacao2);border-top:1px solid #4a3224}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
[hidden]{display:none!important}

/* fases */
#g-escena,#g-portada,#g-final{transition:opacity .8s}
#app:not([data-fase="portada"]) #g-portada,#app:not([data-fase="portada"]) #cartel{opacity:0;visibility:hidden}
#app:not([data-fase="dia"]) #g-escena{opacity:0;visibility:hidden}
#app:not([data-fase="cierre"]) #g-final{opacity:0;visibility:hidden}
#app:not([data-fase="portada"]) #p-portada,#app:not([data-fase="dia"]) #p-dia,#app:not([data-fase="cierre"]) #p-final{display:none}

/* portada */
#glow,#cartel-g{opacity:0;transition:opacity 1.2s}
#app[data-luz="1"] #glow,#app[data-luz="1"] #cartel-g{opacity:1}
#cartel{position:absolute;left:7.5%;width:85%;top:8.2%;height:19.5%;margin:0;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:400;font-style:italic;font-size:9.4cqw;color:var(--dorado);opacity:0;visibility:hidden;transition:opacity 1.2s .3s}
#app[data-luz="1"][data-fase="portada"] #cartel{opacity:1;visibility:visible}
.ola{animation:ola 2.4s ease-in-out infinite}
@keyframes ola{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#p-portada{text-align:center;padding-bottom:24px}
.contador{display:flex;justify-content:center;gap:18px;margin:6px 0 18px;font-family:var(--sans)}
.contador div{min-width:52px}
.contador b{display:block;font:300 2rem/1 var(--serif);color:var(--crema);font-variant-numeric:tabular-nums}
.contador small{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 28px;border-radius:999px;
  border:1.5px solid var(--dorado);background:var(--dorado);color:#2a1710;font-size:1.05rem;cursor:pointer}
.btn[aria-disabled="true"]{background:transparent;color:var(--suave);border-color:#5a4030;cursor:default}
.btn.suave{background:transparent;color:var(--dorado)}
.aun{margin:10px 0 0;font-size:.95rem;color:var(--suave);font-style:italic}
#lineas p{margin:.2em 0;font-size:1.15rem;line-height:1.5}
#lineas .btn{margin-top:16px}

/* texto, puntos y línea del día */
#texto,#estrofas{min-height:5.5em;max-height:max(5.5em,calc(100dvh - min(100vw,720px)*1.1 - 178px));overflow-y:auto;font-size:1.2rem;line-height:1.55;overscroll-behavior:contain}
#texto p,#estrofas p{margin:0 0 .7em;animation:entra .6s both}
#texto p{display:none}
#app[data-mov="solecito"] #texto p[data-mov="solecito"],#app[data-mov="cielito"] #texto p[data-mov="cielito"],#app[data-mov="negrita"] #texto p[data-mov="negrita"]{display:block}
#estrofas p{margin-bottom:1em;font-style:italic}
@keyframes entra{from{opacity:0}to{opacity:1}}
.control{position:sticky;bottom:0;background:var(--cacao2);padding:6px 0 calc(12px + env(safe-area-inset-bottom))}
#p-final{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.dots{display:flex;justify-content:center;gap:18px;margin:6px 0 12px}
.dots div{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--suave);opacity:.8}
.dots i.on{background:var(--acento);border-color:var(--acento);opacity:1}
.linea{position:relative;height:44px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.riel{position:absolute;left:22px;right:22px;top:17px;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#f0b050 0%,#f8eed2 30%,#e0607a 55%,#4a2a55 85%,#2d1a38 100%)}
.pulgar{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--crema);border:3px solid var(--acento);box-shadow:0 0 0 2px #1f120d}
.pulgar::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--acento);opacity:0}
.pulgar.llama::after{animation:resp 2.2s ease-in-out infinite}
.movs{display:flex;justify-content:space-between;padding:2px 14px 0;font:.78rem var(--sans);color:var(--suave);letter-spacing:.08em}
.volver{display:inline-block;margin-top:6px;padding:12px 4px;min-height:44px;background:none;border:0;color:var(--suave);font-size:.95rem;font-style:italic;text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* objetos tocables */
.obj{cursor:pointer;outline:none}
.obj[data-sweep]{touch-action:none}
.hit{fill:#000;fill-opacity:0;stroke:var(--acento);stroke-opacity:0}
.obj:focus-visible .hit{stroke-opacity:1;stroke-width:3}
.halo{fill:none;stroke:var(--acento);stroke-width:2;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.sig .halo{animation:resp 2.2s ease-in-out infinite}
@keyframes resp{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.95;transform:scale(1.18)}}
.fx,.fx *{transform-box:fill-box}

/* caminar */
.pa,.pb{transform-box:fill-box;transform-origin:50% 0;animation:paso .7s ease-in-out infinite alternate;--g:16deg}
.pb{animation-direction:alternate-reverse}
@keyframes paso{from{transform:rotate(calc(var(--g)*-1))}to{transform:rotate(var(--g))}}
.rebote{animation:reb .35s ease-in-out infinite alternate}
@keyframes reb{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
#concha.salta .rebote{animation:salto .5s ease-out 2}
@keyframes salto{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* estados de los objetos */
#o-s1 .rayos{opacity:0;transition:opacity 1s}#o-s1.on .rayos{opacity:.55}
#o-s2 .cab{transform-origin:center;transition:transform .9s}#o-s2.on .cab{transform:rotate(70deg) scale(1.15)}
#o-s4 .tapa{transform-origin:0 100%;transition:transform .7s}#o-s4.on .tapa{transform:rotate(-58deg)}
#o-s4 .bri{opacity:0;transition:opacity .7s}#o-s4.on .bri{opacity:.9}
#o-s5 .it{transition:transform 1s,opacity 1s}#o-s5.on .it{transform:translateX(38px);opacity:.3}
#o-c2 .mia{transform:translateY(18px);transition:transform .9s}#o-c2.on .mia{transform:translateY(0)}
#o-c2 .ext{stroke-opacity:0;transition:stroke-opacity .8s}#o-c2.on .ext{stroke-opacity:1}
.vap{opacity:0;transition:opacity .8s}.on .vap{opacity:.8}
#o-c3b .cob{transform-origin:center;transition:transform .6s}#o-c3b.on .cob{transform:rotate(-6deg) translateY(-2px)}
#o-c3c .pan{transform-origin:center;transition:transform .6s}#o-c3c.on .pan{transform:scale(1.15)}
#o-c4 .pg{transition:opacity .7s}#o-c4.on .pg{opacity:0}
#o-c5 .mk{transition:opacity 1s}#o-c5.on .mk{opacity:0}
.ring{opacity:0;transform-origin:center}
.guino .ring{animation:guino .9s ease-in-out 3}
@keyframes guino{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1.4)}}
.orb{transition:transform 1.6s}#o-n3a.on .orb{transform:translateX(62px)}#o-n3b.on .orb{transform:translateX(-62px)}
#guir.on .bu{animation:titila 1.4s ease-in-out infinite alternate}
@keyframes titila{from{opacity:.45}to{opacity:1}}
.lz{opacity:0;transition:opacity 1.2s}.on .lz{opacity:1}
#haz{opacity:0;transform-origin:0 50%;transform:scaleX(.25);transition:transform 2.4s,opacity 2.4s}#haz.on{opacity:.45;transform:scaleX(1)}
/* final */
.vg{opacity:.4;transition:opacity 1s}.vg.on{opacity:1}
#e2.on .barco{animation:barco 10s ease-in-out 1}
@keyframes barco{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(-34px) scale(.75)}}
#e3.on .nota{animation:flota 2.6s ease-in-out infinite alternate}
@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-8px)}}
#e4 .puerta{transform-origin:0 50%;transition:transform 1s}#e4.on .puerta{transform:scaleX(.3)}
#e4 .lz,#e1 .lz{transition:opacity 1.2s}

.pausa *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.15s!important;transition-delay:0s!important}
  .ola,.pa,.pb,.rebote,.nota,#guir.on .bu,#texto p,#estrofas p{animation:none!important}
  #concha.salta .rebote,#e2.on .barco,.guino .ring,.pulgar.llama::after{animation:none!important}
  .sig .halo{animation:none;opacity:.85}
  .pulgar.llama::after{opacity:.85}
  .guino .ring{opacity:.9}
  #e2.on .barco{transform:translateX(-12px)}
}

/* computador: escena grande al centro, texto a un lado */
@media (min-width:980px) and (min-height:560px){
  #app{max-width:none;grid-template-columns:auto minmax(300px,380px);justify-content:center;grid-template-rows:1fr;align-items:center;gap:48px;padding:0 40px}
  .stage{width:min(58vw,calc(92vh*400/440));border-radius:14px;box-shadow:0 0 0 1px #4a3224}
  .panel{border:0;background:transparent;padding:0}
  .control{background:transparent;position:static}
  #texto,#estrofas{font-size:1.3rem;max-height:62vh}
}
</style>
</head>
<body>
<div id="app" data-fase="portada" data-mov="solecito">

<div class="stage" id="stage">
<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a0a0"/><stop offset=".6" stop-color="#f2c27b"/><stop offset="1" stop-color="#f6c66b"/></linearGradient>
  <linearGradient id="gNoon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8d0e0"/><stop offset="1" stop-color="#f8eed2"/></linearGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c3b58"/><stop offset=".55" stop-color="#e0607a"/><stop offset="1" stop-color="#f29a6a"/></linearGradient>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1030"/><stop offset="1" stop-color="#4a2a55"/></linearGradient>
  <linearGradient id="gFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1a38"/><stop offset="1" stop-color="#3a2218"/></linearGradient>
  <radialGradient id="gSol"><stop offset="0" stop-color="#ffe29a" stop-opacity=".85"/><stop offset="1" stop-color="#ffe29a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gBrillo"><stop offset="0" stop-color="#ffb36b" stop-opacity=".95"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
  <radialGradient id="gLuz"><stop offset="0" stop-color="#f2b45a" stop-opacity=".75"/><stop offset="1" stop-color="#c98a3a" stop-opacity="0"/></radialGradient>
  <clipPath id="cp-paisaje"><use href="#montL"/><use href="#montC"/><use href="#suelo"/><use href="#camino"/><use href="#casas"/><use href="#techos"/></clipPath>
  <symbol id="pers" viewBox="0 0 10 22"><circle cx="5" cy="4" r="3.4" fill="var(--piel)"/><path d="M1 22V11Q1 8 5 8T9 11V22Z" fill="var(--ropa)"/></symbol>
</defs>

<!-- PORTADA -->
<g id="g-portada" aria-hidden="true">
  <rect width="400" height="440" fill="#231510"/>
  <ellipse id="glow" cx="200" cy="260" rx="210" ry="170" fill="url(#gLuz)"/>
  <g id="cartel-g"><rect x="30" y="36" width="340" height="86" rx="12" fill="#3a2318" stroke="#e6b450" stroke-width="1.5"/></g>
  <g id="gente" opacity="0"></g>
</g>

<!-- ESCENA -->
<g id="g-escena">
  <g aria-hidden="true">
    <rect width="400" height="345" fill="url(#gDawn)"/>
    <rect id="sk-noon" width="400" height="345" fill="url(#gNoon)"/>
    <rect id="sk-dusk" width="400" height="345" fill="url(#gDusk)"/>
    <rect id="sk-night" width="400" height="345" fill="url(#gNight)"/>
    <g id="estrellas" fill="#f4e6d0"></g>
    <path id="luna" d="M332 52a17 17 0 1 0 15 25a13 13 0 1 1-15-25z" fill="#f3e3b8"/>
    <ellipse id="brillo" cx="350" cy="316" rx="120" ry="46" fill="url(#gBrillo)"/>
    <g id="sol"><circle r="42" fill="url(#gSol)"/><circle r="17" fill="#ffd36b"/><circle id="sol-rojo" r="17" fill="#ff8a5c"/></g>
    <path id="montL" d="M0 292L40 284L80 300L130 262L190 296L250 254L310 292L350 272L400 290V345H0Z" fill="#7a4f3c"/>
    <path id="montC" d="M0 330Q60 292 120 326Q190 286 250 328Q320 298 400 326V372H0Z" fill="#5a3828"/>
    <path id="suelo" d="M0 352Q200 334 400 354V440H0Z" fill="#46301f"/>
    <path id="camino" d="M0 405Q200 420 400 372V392Q200 445 0 440Z" fill="#8a6240"/>
    <g id="flores"></g>
    <path id="casas" fill="#9a6a45" d="M14 354h52v48h-52zM186 250h166v148h-166zM108 328h20v18h-20zM134 330h20v16h-20zM160 327h20v19h-20zM22 302h24v24h-24z"/>
    <path id="techos" fill="#5a3320" d="M10 354L40 330L70 354zM178 250L269 218L360 250zM105 328L118 316L131 328zM131 330L144 318L157 330zM157 327L170 315L183 327zM19 302L34 288L49 302zM33 280h2v8h-2zM30 283h8v2h-8z"/>
    <g clip-path="url(#cp-paisaje)">
      <rect id="t-alba" x="0" y="210" width="400" height="230" fill="#f0b050"/>
      <rect id="t-tarde" x="0" y="210" width="400" height="230" fill="#b0304f"/>
      <rect id="t-noche" x="0" y="210" width="400" height="230" fill="#1c0f2e"/>
    </g>
    <rect id="ig-v" x="30" y="309" width="6" height="9" fill="#ffd36b"/>
    <g id="vb" fill="#ffcf70"><rect x="116" y="334" width="5" height="5"/><rect x="142" y="335" width="5" height="5"/><rect x="168" y="333" width="5" height="5"/></g>
    <rect id="hl-v" x="24" y="364" width="16" height="14" fill="#ffd36b"/>
    <rect x="46" y="372" width="12" height="30" fill="#2a1710"/>
    <path id="hl-luz" d="M46 402L58 402L80 418L40 418Z" fill="#ffd36b"/>
    <rect x="262" y="362" width="16" height="36" fill="#3a2418"/>
    <g id="ventn" fill="#ffcf70"><rect x="206" y="318" width="32" height="30"/><rect x="296" y="318" width="46" height="38"/><rect x="298" y="350" width="42" height="8" fill="#7a3a2a"/></g>
    <path id="guir-h" d="M96 304Q140 322 184 306" fill="none" stroke="#3a2418" stroke-width="1.2"/>
    <g id="int"><rect x="194" y="258" width="150" height="138" rx="4" fill="#ecab52"/><rect x="204" y="346" width="132" height="3" fill="#6b4a35"/></g>
    <g id="puesto"><rect x="238" y="372" width="3" height="32" fill="#5a3320"/><rect x="281" y="372" width="3" height="32" fill="#5a3320"/><path d="M232 374L290 374L284 360L238 360Z" fill="#c98a3a"/><rect x="240" y="394" width="42" height="5" fill="#6b4a35"/><ellipse cx="250" cy="390" rx="7" ry="5" fill="#3a2418"/><rect x="266" y="386" width="12" height="9" rx="2" fill="#b5683a"/></g>
    <g id="guir" class="fx" data-ef="N4"></g>
  </g>
  <g id="personajes" aria-hidden="true">
    <g id="concha">
      <g class="pb"><rect x="-11" y="-6" width="4" height="6" rx="2" fill="#6e4224"/></g>
      <g class="pa"><rect x="9" y="-6" width="4" height="6" rx="2" fill="#6e4224"/></g>
      <g class="rebote">
        <path d="M-15-10Q-13-20-3-20T-14-24" fill="none" stroke="#8a5530" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-10" rx="15" ry="8" fill="#8a5530"/>
        <path d="M-14-6Q-8 0-2-3T10-3T15-7L14-9H-14Z" fill="#6e4224"/>
        <circle cx="16" cy="-14" r="7.5" fill="#8a5530"/>
        <ellipse cx="11" cy="-9" rx="3.2" ry="6" fill="#6e4224"/>
        <ellipse cx="22" cy="-12.5" rx="2.6" ry="2.2" fill="#2a1710"/>
      </g>
      <g class="pa"><rect x="-6" y="-6" width="4" height="6" rx="2" fill="#8a5530"/></g>
      <g class="pb"><rect x="4" y="-6" width="4" height="6" rx="2" fill="#8a5530"/></g>
    </g>
    <g id="chica">
      <g class="pb"><rect x="-5.5" y="-22" width="4.4" height="22" rx="2.2" fill="#8b5a3c"/></g>
      <g class="rebote">
        <path d="M-9-46L9-46L13-20H-13Z" fill="#b5683a"/>
        <path d="M-9-56Q-14-40-9-33L-4-44Z" fill="#2a1a12"/>
        <circle cx="0" cy="-54" r="8" fill="#8b5a3c"/>
        <path d="M-8.4-54A8.4 8.4 0 0 1 8.4-56Q2-60-8.4-54Z" fill="#2a1a12"/>
        <circle cx="6.2" cy="-49.5" r="1.6" fill="#e6b450"/>
        <g class="pa"><rect x="-2" y="-46" width="3.6" height="17" rx="1.8" fill="#8b5a3c"/></g>
      </g>
      <g class="pa"><rect x="1.1" y="-22" width="4.4" height="22" rx="2.2" fill="#8b5a3c"/></g>
    </g>
  </g>

  <g id="objetos">
    <!-- Solecito -->
    <g class="obj fx" id="o-s1" data-f="S1" data-z="0,0.2" role="button" tabindex="0" aria-label="Ventana con luz">
      <path class="rayos" d="M40 366L112 398L112 412L40 378Z" fill="#ffe29a"/>
      <circle class="hit" cx="32" cy="371" r="25"/>
    </g>
    <g class="obj" id="o-s3" data-f="S3" data-z="0,0.2" role="button" tabindex="0" aria-label="Perrita que se adelanta"><circle class="hit" r="28"/></g>
    <g class="obj fx" id="o-s2" data-f="S2" data-z="0.2,0.37" role="button" tabindex="0" aria-label="Flor que se gira">
      <rect x="83" y="368" width="2.4" height="26" fill="#5a7a3a"/><ellipse cx="78" cy="384" rx="6" ry="2.6" fill="#5a7a3a"/>
      <g class="cab"><circle cx="84" cy="365" r="9" fill="#e6b450"/><circle cx="84" cy="365" r="5" fill="#6b4a35"/><circle cx="84" cy="353" r="3.4" fill="#e6b450"/><circle cx="95" cy="359" r="3.4" fill="#e6b450"/><circle cx="95" cy="371" r="3.4" fill="#e6b450"/><circle cx="84" cy="377" r="3.4" fill="#e6b450"/><circle cx="73" cy="371" r="3.4" fill="#e6b450"/><circle cx="73" cy="359" r="3.4" fill="#e6b450"/></g>
      <circle class="hit" cx="84" cy="370" r="25"/>
    </g>
    <g class="obj fx" id="o-s4" data-f="S4" data-z="0.2,0.37" role="button" tabindex="0" aria-label="Cajón cerrado">
      <rect x="120" y="382" width="32" height="20" rx="2" fill="#8a5a3c"/><rect class="bri" x="122" y="382" width="28" height="5" fill="#ffd36b"/>
      <g class="tapa"><rect x="118" y="374" width="36" height="8" rx="2" fill="#6b4a35"/></g>
      <circle class="hit" cx="136" cy="388" r="25"/>
    </g>
    <g class="obj fx" id="o-s5" data-f="S5" data-sweep data-z="0.2,0.37" role="button" tabindex="0" aria-label="Manos que reparten">
      <ellipse cx="178" cy="394" rx="9" ry="5" fill="#8b5a3c"/><ellipse cx="198" cy="394" rx="9" ry="5" fill="#8b5a3c"/>
      <circle class="it" cx="184" cy="384" r="3.6" fill="#e6b450"/><circle class="it" cx="192" cy="381" r="3.6" fill="#e6b450" style="transition-delay:.2s"/><circle class="it" cx="188" cy="375" r="3.6" fill="#e6b450" style="transition-delay:.4s"/>
      <circle class="hit" cx="188" cy="386" r="25"/>

  E.concha.style.transform=`translate(${dx.toFixed(1)}px,${(roadY(dx)+2).toFixed(1)}px) scale(${(sc*.95).toFixed(3)})`;
  E['o-s3'].style.transform=`translate(${dx.toFixed(1)}px,${(roadY(dx)-12).toFixed(1)}px)`;
  E.personajes.style.opacity=1-.3*noche;
  zonas.forEach(({e,a,b})=>{const w=smooth(t,a-.03,a)*(1-smooth(t,b,b+.03));e.style.opacity=w.toFixed(2);e.style.visibility=w>.05?'visible':'hidden';e.style.pointerEvents=w>.5?'auto':'none'});
  const L=$('#linea'), w=L.offsetWidth||300;
  $('#pulgar').style.transform=`translateX(${(t*(w-44)).toFixed(1)}px)`;
  L.setAttribute('aria-valuenow',Math.round(t*100));
  L.setAttribute('aria-valuetext',textoMov(t)+', '+textoHora(t));
  if(app.dataset.fase!=='cierre')app.dataset.mov=textoMov(t).toLowerCase();
  guia();
}
function setT(t,usuario){
  t=clamp(t);
  if(reduce.matches)t=STOPS.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
  T=t; if(!pend){pend=true;requestAnimationFrame(pintar)}
  if(usuario&&app.dataset.fase==='dia')F.forEach(f=>{if(f.tipo==='dia'&&!done.has(f.id)&&T>=f.z[0]&&T<=f.z[1])activar(f.id)});
}
function mostrar(f){app.dataset.fase=f; if(f==='dia')setT(T); if(f==='cierre')app.dataset.mov='negrita'; guia()}

/* ---------- recorrido: activar fragmentos ---------- */
const done=new Set();
const extras={
  S3(){$('#concha').classList.add('salta')},
  N2(el){$$('.obj[data-f="N2"]').forEach(o=>{o.classList.add('on');if(o!==el)o.classList.add('guino')})},
  N5(){setTimeout(()=>activar('N6'),reduce.matches?300:1800)},
  N7(){setTimeout(()=>mostrar('cierre'),reduce.matches?600:2400)},
  E4(){$('#volver').hidden=false}
};
function agregarTexto(f){
  const cont=f.m==='final'?$('#estrofas'):$('#texto'), p=document.createElement('p');
  p.dataset.f=f.id; p.dataset.mov=f.m;
  if(f.l)f.l.forEach((x,i)=>{if(i)p.appendChild(document.createElement('br'));p.appendChild(document.createTextNode(x))});
  else p.textContent=f.t;
  cont.insertBefore(p,[...cont.children].find(c=>idx(c.dataset.f)>idx(f.id))||null);
  p.scrollIntoView({block:'nearest'});
}
function activar(id,el){
  const f=F[idx(id)]; if(!f)return;
  if(el)el.classList.add('on');
  if(done.has(id))return;
  done.add(id);
  if(!el)$$('.obj[data-f="'+id+'"]').forEach(o=>o.classList.add('on'));
  $$('[data-ef="'+id+'"]').forEach(o=>o.classList.add('on'));
  agregarTexto(f);
  $$('.dots i[data-f="'+id+'"]').forEach(i=>i.classList.add('on'));
  extras[id]&&extras[id](el);
  guia();
}
function guia(){
  $$('.sig').forEach(e=>e.classList.remove('sig'));
  const pul=$('#pulgar'); pul.classList.remove('llama');
  const f=F.find(x=>!done.has(x.id)), fase=app.dataset.fase; if(!f||f.tipo==='auto')return;
  const objs=$$('.obj[data-f="'+f.id+'"]');
  if(fase==='cierre'){if(f.m==='final')objs.forEach(o=>o.classList.add('sig'));return}
  if(fase!=='dia'||f.m==='final')return;
  const vis=objs.filter(o=>o.style.visibility==='visible');
  vis.forEach(o=>o.classList.add('sig'));
  if(f.tipo==='dia'||!vis.length)pul.classList.add('llama');
}
$$('.obj').forEach(o=>{
  const id=o.dataset.f; let lx=null,ly=0,dist=0,down=false;
  o.addEventListener('click',()=>activar(id,o));
  o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activar(id,o)}});
  if(o.hasAttribute('data-sweep')){
    o.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;dist=0});
    o.addEventListener('pointerenter',e=>{lx=e.clientX;ly=e.clientY;dist=0});
    o.addEventListener('pointermove',e=>{
      if(!(down||(e.pointerType==='mouse'&&o.hasAttribute('data-hover'))))return;
      if(lx!==null)dist+=Math.hypot(e.clientX-lx,e.clientY-ly); lx=e.clientX;ly=e.clientY;
      if(dist>40)activar(id,o);
    });
    o.addEventListener('pointerup',()=>{down=false});
    o.addEventListener('pointerleave',()=>{lx=null;down=false});
  }
});
function dots(c){let k=0;[6,7,7,4].forEach(n=>{const g=document.createElement('div');for(let i=0;i<n;i++){const e=document.createElement('i');e.dataset.f=F[k++].id;g.appendChild(e)}c.appendChild(g)})}
dots($('#dots'));dots($('#dots2'));
$('#volver').addEventListener('click',()=>{mostrar('dia');setT(0)});

/* ---------- línea del día ---------- */
const L=$('#linea'); let arrastre=false;
const desde=e=>{const r=L.getBoundingClientRect();return (e.clientX-r.left-22)/(r.width-44)};
L.addEventListener('pointerdown',e=>{arrastre=true;L.setPointerCapture(e.pointerId);setT(desde(e),true)});
L.addEventListener('pointermove',e=>{if(arrastre||e.pointerType==='mouse')setT(desde(e),true)});
L.addEventListener('pointerup',()=>{arrastre=false});
L.addEventListener('pointercancel',()=>{arrastre=false});
L.addEventListener('keydown',e=>{
  const k=e.key; const dir=k==='ArrowRight'||k==='ArrowUp'?1:k==='ArrowLeft'||k==='ArrowDown'?-1:0;
  if(k==='Home'){setT(0,true);e.preventDefault();return}
  if(k==='End'){setT(1,true);e.preventDefault();return}
  if(!dir)return; e.preventDefault();
  if(reduce.matches){const i=STOPS.findIndex(x=>Math.abs(x-T)<1e-6);setT(STOPS[clamp((i<0?0:i)+dir,0,STOPS.length-1)],true)}
  else setT(T+dir*.03,true);
});
addEventListener('resize',()=>setT(T));

/* ---------- pausa con pestaña oculta o fuera de pantalla ---------- */
let vis=true; const pausa=()=>app.classList.toggle('pausa',document.hidden||!vis);
document.addEventListener('visibilitychange',pausa);
if('IntersectionObserver' in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting;pausa()}).observe($('#stage'));

/* ---------- arranque (parámetros solo para pruebas; requieren ?abierto=1) ---------- */
if(abierta&&P.get('t'))T=clamp(parseFloat(P.get('t'))||0);
if(abierta&&P.get('fase')==='dia')mostrar('dia');
if(abierta&&P.get('fase')==='cierre'){F.forEach(f=>{if(f.m!=='final')done.add(f.id)});mostrar('cierre')}
setT(T);
})();
</script>
</body>
