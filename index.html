<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, Salomé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf7f4; --ac: #d4889f; --ink: #3b2a33; --soft: #8a7480;
          --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif; --sans: "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; overflow: hidden; transition: background-color 1.2s ease; }
  .pantalla { position: fixed; inset: 0; transition: opacity 1.4s ease; }
  .oculta { opacity: 0; pointer-events: none; }

  /* ---------- CONTADOR ---------- */
  #cuenta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.2rem; padding: 2rem; }
  .pulso { width: 14px; height: 14px; border-radius: 50%; background: var(--ac); animation: respira 3.2s ease-in-out infinite; }
  @keyframes respira { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,136,159,.4); } 50% { transform: scale(1.5); box-shadow: 0 0 0 22px rgba(212,136,159,0); } }
  #cuenta .peq { font-size: .72rem; letter-spacing: .4em; text-transform: uppercase; color: var(--soft); }
  #cuenta h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.1; }
  #cuenta h1 em { color: var(--ac); font-style: italic; }
  .reloj { display: flex; gap: clamp(1.2rem, 5vw, 3.4rem); align-items: flex-start; }
  .reloj div { min-width: 3.4rem; }
  .reloj b { display: block; font-family: var(--serif); font-weight: 300; font-size: clamp(2.2rem, 7vw, 4rem); font-variant-numeric: tabular-nums; line-height: 1; }
  .reloj small { display: block; margin-top: .6rem; font-size: .62rem; letter-spacing: .3em; text-transform: uppercase; color: var(--soft); }
  .linea-fina { width: min(320px, 60vw); height: 1px; background: linear-gradient(90deg, transparent, var(--soft), transparent); opacity: .5; }

  /* ---------- HISTORIA ---------- */
  #historia { display: flex; flex-direction: column; }
  .progreso { position: absolute; top: 0; left: 0; height: 2px; width: 0; background: var(--ac); transition: width .8s ease, background .8s ease; z-index: 3; }
  .carril { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carril::-webkit-scrollbar { display: none; }
  .cap { flex: 0 0 100vw; scroll-snap-align: start; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 5vw; padding: 0 9vw 4rem; }
  .art { display: flex; align-items: center; justify-content: center; cursor: default; }
  .art svg { width: min(100%, 44vh, 380px); height: auto; overflow: visible; }
  .txt { max-width: 34rem; }
  .txt > * { opacity: 0; transform: translateY(16px); transition: opacity 1s ease, transform 1s ease; }
  .on .txt > * { opacity: 1; transform: none; transition-delay: calc(var(--k, 0) * .14s + .25s); }
  .tag { display: block; font-size: .7rem; letter-spacing: .35em; text-transform: uppercase; color: var(--ac); margin-bottom: 1.2rem; }
  .txt h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.1; margin-bottom: 1.3rem; }
  .txt h2 em { font-style: italic; color: var(--ac); }
  .txt p { font-size: clamp(.95rem, 1.5vw, 1.08rem); line-height: 1.85; color: #5b4852; margin-bottom: .9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.2rem; }
  .chips span { border: 1px solid color-mix(in srgb, var(--ac) 55%, transparent); color: var(--ac); border-radius: 999px; padding: .3rem .85rem; font-size: .78rem; letter-spacing: .06em; transition: background .4s, color .4s; }
  .chips span:hover { background: var(--ac); color: #fff; }
  .hero { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; text-align: center; gap: 1rem; padding-bottom: 6rem; }
  .hero .art svg { width: min(100%, 17vh, 150px); }
  .hero .txt { max-width: 40rem; }
  .hero h2 { font-size: clamp(2.6rem, 8vw, 5.4rem); letter-spacing: .02em; }
  .final .grande { font-family: var(--serif); font-weight: 300; font-size: clamp(5rem, 16vw, 11rem); line-height: .9; color: var(--ac); }
  .indica { position: absolute; bottom: 3.4rem; left: 50%; transform: translateX(-50%); font-size: .68rem; letter-spacing: .35em; text-transform: uppercase; color: var(--soft); animation: sube 2.6s ease-in-out infinite; z-index: 2; transition: opacity .6s; }
  @keyframes sube { 50% { transform: translate(-50%, -6px); } }

  /* navegación */
  .nav { position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%); display: flex; gap: .9rem; align-items: center; z-index: 3; }
  .nav button { position: relative; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--soft); background: transparent; cursor: pointer; transition: transform .4s, background .4s, border-color .4s; }
  .nav button:hover { transform: scale(1.6); border-color: var(--ac); }
  .nav button.on { background: var(--ac); border-color: var(--ac); transform: scale(1.4); }
  .nav button span { position: absolute; bottom: 160%; left: 50%; transform: translate(-50%, 4px); white-space: nowrap; font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .nav button:hover span { opacity: 1; transform: translate(-50%, 0); }

  /* ilustraciones */
  svg * { fill: none; stroke: var(--ac); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  svg .fill { fill: var(--ac); stroke: none; }
  svg .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .on svg .dr { animation: dibuja 1.9s ease forwards; animation-delay: calc(var(--i, 0) * .09s + .2s); }
  @keyframes dibuja { to { stroke-dashoffset: 0; } }
  svg .pt { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.3); transition: opacity .8s ease, transform .8s cubic-bezier(.2,1.4,.3,1); }
  .on svg .pt { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * .1s + .3s); }
  .llega { animation: none; }
  .on .llega { animation: llega 1.6s cubic-bezier(.2,.9,.2,1) 1.4s both; }
  @keyframes llega { from { opacity: 0; transform: translateX(-90px); } to { opacity: 1; transform: none; } }
  svg .haz { fill: var(--ac); stroke: none; opacity: 0; }
  .on svg .haz { animation: haz 3s ease-in-out infinite; }
  @keyframes haz { 0%,100% { opacity: .08; } 50% { opacity: .22; } }
  svg .bar { fill: var(--ac); stroke: none; transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.15); }
  .on svg .bar { animation: eq var(--d, 1.2s) ease-in-out infinite alternate; }
  @keyframes eq { to { transform: scaleY(1); } }
  svg .anillo { opacity: .0; transform-box: fill-box; transform-origin: center; }
  .on svg .anillo { animation: onda 4s ease-out infinite; animation-delay: calc(var(--i) * 1.1s); }
  @keyframes onda { 0% { opacity: .7; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.3); } }

  @media (max-width: 800px) {
    .cap { grid-template-columns: 1fr; grid-template-rows: 38% auto; align-content: center; padding: 0 7vw 5rem; gap: 1rem; }
    .art svg { width: min(60vw, 28vh); }
    .indica { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; } }
</style>
</head>
<body>

<main class="pantalla" id="cuenta">
  <div class="pulso"></div>
  <div class="peq">Una sorpresa para Salomé</div>
  <h1>Falta <em>muy poco</em></h1>
  <div class="linea-fina"></div>
  <div class="reloj">
    <div><b id="d">--</b><small>días</small></div>
    <div><b id="h">--</b><small>horas</small></div>
    <div><b id="m">--</b><small>min</small></div>
    <div><b id="s">--</b><small>seg</small></div>
  </div>
</main>

<section class="pantalla oculta" id="historia">
  <div class="progreso" id="progreso"></div>
  <div class="carril" id="carril"></div>
  <div class="indica" id="indica">Desliza →</div>
  <nav class="nav" id="nav"></nav>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DESBLOQUEO = new Date("2026-12-31T00:00:00-05:00").getTime();

  /* ---------- Ilustraciones mínimas (SVG generado) ---------- */
  const P = (d, i = 0, extra = "") => `<path class="dr" pathLength="1" style="--i:${i}" d="${d}" ${extra}/>`;
  const star = (cx, cy, R, r) => { let d = ""; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, q = k % 2 ? r : R; d += (k ? "L" : "M") + (cx + q * Math.cos(a)).toFixed(1) + " " + (cy + q * Math.sin(a)).toFixed(1); } return d + "Z"; };
  const ART = {
    inicio: () => `<svg viewBox="0 0 200 200">${[0,1,2].map(i => `<circle class="anillo" style="--i:${i}" cx="100" cy="100" r="80"/>`).join("")}<circle class="fill" cx="100" cy="100" r="5"/></svg>`,
    juvenil: () => { let s = ""; for (let i = 0; i < 8; i++) { if (i === 4) continue; const a = i * Math.PI / 4; s += `<circle class="pt" style="--i:${i}" cx="${(100 + 55 * Math.cos(a)).toFixed(1)}" cy="${(100 + 55 * Math.sin(a)).toFixed(1)}" r="7"/>`; }
      return `<svg viewBox="0 0 200 200">${s}${P("M100 86v28M88 97h24", 3)}<circle class="fill llega" cx="45" cy="100" r="7"/></svg>`; },
    flores: () => { let s = ""; for (let i = 0; i < 14; i++) s += `<g transform="rotate(${i * 360 / 14} 100 84)"><ellipse class="dr" pathLength="1" style="--i:${i}" cx="100" cy="50" rx="7" ry="17"/></g>`;
      return `<svg viewBox="0 0 200 200">${s}<circle class="dr" pathLength="1" style="--i:15" cx="100" cy="84" r="16"/>${P("M100 100C100 140 95 170 100 196", 16)}${P("M99 150C82 140 72 146 64 138C82 132 96 138 99 150", 18)}${P("M100 165C116 156 128 160 136 152C118 146 104 152 100 165", 19)}</svg>`; },
    concha: () => { const paw = (x, y, r, i) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(1.9)"><ellipse class="dr" pathLength="1" style="--i:${i}" cx="0" cy="4" rx="6" ry="5"/>${[[-7,-3],[-2.6,-8],[2.6,-8],[7,-3]].map(([a, b], k) => `<circle class="dr" pathLength="1" style="--i:${i + 1 + k * .3}" cx="${a}" cy="${b}" r="2.4"/>`).join("")}</g>`;
      return `<svg viewBox="0 0 200 200">${paw(45, 155, -18, 0)}${paw(88, 118, 18, 6)}${paw(128, 86, -18, 12)}${paw(163, 48, 18, 18)}</svg>`; },
    ciencia: () => { let a = "", b = "", rungs = ""; for (let x = 20; x <= 180; x += 2) { const y1 = 100 + 34 * Math.sin((x - 20) / 160 * Math.PI * 4), y2 = 100 + 34 * Math.sin((x - 20) / 160 * Math.PI * 4 + Math.PI); a += (x === 20 ? "M" : "L") + x + " " + y1.toFixed(1); b += (x === 20 ? "M" : "L") + x + " " + y2.toFixed(1); }
      for (let k = 0; k <= 16; k++) { const x = 20 + k * 10, y1 = 100 + 34 * Math.sin((x - 20) / 160 * Math.PI * 4), y2 = 100 + 34 * Math.sin((x - 20) / 160 * Math.PI * 4 + Math.PI); rungs += P(`M${x} ${y1.toFixed(1)}L${x} ${y2.toFixed(1)}`, 4 + k * .5, 'style="opacity:.55"'); }
      return `<svg viewBox="0 0 200 200">${P(a, 0)}${P(b, 1)}${rungs}</svg>`; },
    ninos: () => { let s = ""; [40, 70, 100, 130, 160].forEach((x, i) => { s += `<circle class="pt" style="--i:${i}" cx="${x}" cy="126" r="8"/><path class="pt" style="--i:${i + .4}" d="M${x - 12} 158a12 12 0 0 1 24 0"/>`; });
      return `<svg viewBox="0 0 200 200">${s}${P(star(100, 62, 20, 8), 6)}</svg>`; },
    cine: () => `<svg viewBox="0 0 200 200"><polygon class="haz" points="28,104 72,66 72,142"/><circle class="pt" style="--i:0" cx="22" cy="104" r="8"/><rect class="dr" pathLength="1" style="--i:1" x="72" y="62" width="108" height="84" rx="6"/>${P("M126 124C104 108 112 90 126 100C140 90 148 108 126 124Z", 5)}</svg>`,
    viaje: () => { const d = "M26 158C60 60 112 196 172 52"; return `<svg viewBox="0 0 200 200">${P(d, 0, 'style="stroke-dasharray:.02 .03;stroke-dashoffset:1"')}<circle class="pt" style="--i:0" cx="26" cy="158" r="5"/><circle class="pt" style="--i:9" cx="172" cy="52" r="8"/><circle class="fill" r="3.5"><animateMotion dur="4s" repeatCount="indefinite" path="${d}"/></circle></svg>`; },
    musica: () => { const h = [.5, .9, .65, 1, .45, .8, .6, .95, .5, .75, .4]; return `<svg viewBox="0 0 200 200">${h.map((v, i) => `<rect class="bar" style="--d:${(0.9 + (i * 37 % 7) / 10).toFixed(1)}s" x="${24 + i * 14.5}" y="${150 - 100 * v}" width="7" height="${100 * v}" rx="3.5"/>`).join("")}</svg>`; },
    final: () => { let s = ""; for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2 - Math.PI / 2; s += `<circle class="pt fill" style="--i:${i}" cx="${(100 + 82 * Math.cos(a)).toFixed(1)}" cy="${(100 + 82 * Math.sin(a)).toFixed(1)}" r="3.2"/>`; } return `<svg viewBox="0 0 200 200">${s}</svg>`; }
  };

  /* ---------- Capítulos ---------- */
  const CAPS = [
    { tag: "Para ti", tit: "Salomé,<br><em>veinte</em> años", art: "inicio", cls: "hero", bg: "#fbf7f4", ac: "#d4889f", p: ["Esta página no tiene prisa. Cada parte cuenta algo de quién eres, y cada animación acompaña una cosa que veo en ti."] },
    { tag: "01 · El comienzo", tit: "Un grupo <em>juvenil</em>, una coincidencia", art: "juvenil", bg: "#f7f0f4", ac: "#c9829f", p: ["Todo empezó en el grupo juvenil. Tú entraste, yo te vi, y no sabía que empezaba lo más bonito de mis días.", "Un día lo dijiste tú: agradeciste a Diosito por llevarte al juvenil y dejarme encontrarte. Yo también."] },
    { tag: "02 · Tus flores", tit: "Siempre <em>girasol</em>", art: "flores", bg: "#fdf4e2", ac: "#d99a2b", p: ["Las flores fueron de las primeras cosas que te di, y hoy las haces tú con tus manos, las pintas en las paredes de tu cuarto y las buscas en Ambato, tierra de flores.", "Para mí siempre serás un girasol: buscas la luz y la compartes con todos."] },
    { tag: "03 · Tu perrita", tit: "La <em>Concha</em> y la mía", art: "concha", bg: "#f6f2ea", ac: "#b58a64", p: ["Tu Concha, pequeñita, mimada y muy tuya. Y la mía, que también te adora. Dos perritas, dos mimadas.", "Me encanta verte con ellas: ahí aparece tu ternura más tranquila."] },
    { tag: "04 · Tu mente", tit: "Mujer <em>científica</em>", art: "ciencia", bg: "#edf5f3", ac: "#4f9f98", p: ["Ingeniería en Biotecnología: laboratorios, mandil, microbiología, placas de agar. Dijiste que amas la biotecnología, y se nota cuando hablas de ella.", "Algún día vas a hacer cosas grandes con ciencia, y yo voy a estar orgulloso de ti en primera fila."] },
    { tag: "05 · Tu corazón", tit: "Catequista, <em>misionera</em>, maestra", art: "ninos", bg: "#faeff3", ac: "#d17a9b", p: ["Los sábados con tus niños de catequesis, el PIM, Cáritas los lunes. Dijiste que más que rezar, eres de servir, sobre todo a los niños.", "Quieres ser profesora, y ya lo eres: sábado a sábado, con paciencia y cariño."] },
    { tag: "06 · Nuestras pelis", tit: "Una película <em>nuestra</em>", art: "cine", bg: "#efeff7", ac: "#8f86c9", p: ["Tus películas de amor, Shrek, las que vemos en casa y las que vamos a ver en el cine. Hay una que nos gusta mucho a los dos, y esa ya es nuestra.", "Contigo hasta el cine sabe diferente."] },
    { tag: "07 · Nuestros viajes", tit: "Primero <em>Cuenca</em>", art: "viaje", bg: "#f1f5f8", ac: "#6f9ec4", p: ["Cuando te preguntaron cuál era tu recuerdo favorito, dijiste: nuestro primer viaje. Cuenca fue el primero; después vinieron más caminos, un retiro, paseos y días enteros contigo.", "Mi lugar favorito del mundo es cualquiera donde estés."] },
    { tag: "08 · Tus cosas pequeñas", tit: "Lo que <em>te hace</em> tú", art: "musica", bg: "#f9f1f6", ac: "#c97aa8", p: ["Helado, café, humita, pintar, hornear galletas, bailar, Morat, Rapunzel, la Navidad. Lo pequeño en ti es siempre lo más bonito."], chips: ["Helado", "Café", "Humita", "Pintar", "Galletas", "Bailar", "Morat", "Rapunzel", "Navidad", "Kuromi"] },
    { tag: "09 · Hoy", tit: "Feliz cumpleaños, <em>Salomé</em>", art: "final", cls: "final", bg: "#fbeef2", ac: "#d4889f", big: "20", p: ["Gracias por tu fe, tu ciencia, tus niños, tus flores y por dejarme ser parte de tu vida.", "Que este año nuevo te cuide tanto como tú cuidas a los demás."] }
  ];

  /* ---------- Construcción ---------- */
  const carril = $("carril"), nav = $("nav"), caps = [];
  CAPS.forEach((c, i) => {
    const s = document.createElement("section"); s.className = "cap " + (c.cls || "");
    s.innerHTML = `<div class="art">${ART[c.art]()}</div><div class="txt"><span class="tag">${c.tag}</span>${c.big ? `<div class="grande">${c.big}</div>` : ""}<h2>${c.tit}</h2>${c.p.map((t) => `<p>${t}</p>`).join("")}${c.chips ? `<div class="chips">${c.chips.map((x) => `<span>${x}</span>`).join("")}</div>` : ""}</div>`;
    [...s.querySelector(".txt").children].forEach((el, k) => el.style.setProperty("--k", k));
    s.querySelector(".art").addEventListener("mouseenter", () => { s.classList.remove("on"); void s.offsetWidth; s.classList.add("on"); }); // repetir la animación
    carril.appendChild(s); caps.push(s);
    const b = document.createElement("button"); b.innerHTML = `<span>${c.tag.replace(/^\d+ · /, "")}</span>`; b.setAttribute("aria-label", c.tag);
    b.addEventListener("click", () => ir(i)); nav.appendChild(b);
  });
  const dots = [...nav.children];
  let actual = -1;
  function activar(i) {
    if (i === actual) return; actual = i; const c = CAPS[i];
    caps.forEach((s, k) => s.classList.toggle("on", k === i)); dots.forEach((d, k) => d.classList.toggle("on", k === i));
    document.documentElement.style.setProperty("--bg", c.bg); document.documentElement.style.setProperty("--ac", c.ac);
    $("progreso").style.width = ((i + 1) / CAPS.length * 100) + "%";
    $("indica").style.opacity = i === 0 ? 1 : 0;
  }
  const obs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) activar(caps.indexOf(e.target)); }), { root: carril, threshold: 0.6 });
  caps.forEach((s) => obs.observe(s));
  function ir(i) { i = Math.max(0, Math.min(CAPS.length - 1, i)); carril.scrollTo({ left: i * carril.clientWidth, behavior: "smooth" }); }
  const idx = () => Math.round(carril.scrollLeft / carril.clientWidth);
  let bloqueo = false;
  carril.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); if (bloqueo) return; bloqueo = true; setTimeout(() => (bloqueo = false), 800); ir(idx() + (e.deltaY > 0 ? 1 : -1)); } }, { passive: false });
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === "ArrowDown") ir(idx() + 1); if (e.key === "ArrowLeft" || e.key === "ArrowUp") ir(idx() - 1); });

  /* ---------- Contador y desbloqueo ---------- */
  let abierta = false;
  function abrir() { abierta = true; $("cuenta").classList.add("oculta"); $("historia").classList.remove("oculta"); activar(0); }
  function tick() {
    const diff = DESBLOQUEO - Date.now();
    if (diff <= 0) { if (!abierta) abrir(); return; }
    const s = Math.floor(diff / 1000), z = (n) => String(n).padStart(2, "0");
    $("d").textContent = Math.floor(s / 86400); $("h").textContent = z(Math.floor((s % 86400) / 3600)); $("m").textContent = z(Math.floor((s % 3600) / 60)); $("s").textContent = z(s % 60);
  }
  tick(); setInterval(tick, 500);
})();
</script>
</body>
</html>
