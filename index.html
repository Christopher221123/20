/* ===== Tokens · paleta C "Papel y crayón" ===== */
:root{
  /* color */
  --papel:#fbf3e4;        /* fondo de toda la página */
  --papel-2:#f4e7cf;      /* hojas y fichas */
  --tinta:#4a1650;        /* texto y trazo principal · 12,5:1 sobre papel */
  --tinta-suave:#6b3f6f;  /* texto secundario · 7,4:1 */
  --morado:#8a3a8f;       /* acento y botones · 6,2:1 */
  --rosado:#e07ba0;       /* solo decorativo (2,5:1) */
  --rosado-tinta:#a8446c; /* rosado para texto · 5,1:1 */
  --rosado-claro:#f6c9d8; /* luz, halos */
  --dorado:#e6c77e;       /* solo decorativo */
  --dorado-palido:#f3e3b5;/* luz cálida */
  /* tipografía */
  --mano:Caveat,"Segoe Print","Bradley Hand",cursive;
  --texto:Newsreader,Georgia,"Times New Roman",serif;
  --t-1:15px; --t-2:17px; --t-3:clamp(22px,4vw,28px); --t-4:clamp(44px,11vw,88px);
  /* espacios (base 4) */
  --e1:4px;--e2:8px;--e3:12px;--e4:16px;--e5:24px;--e6:32px;--e7:48px;--e8:64px;--e9:96px;
  /* curvas */
  --sale:cubic-bezier(.23,1,.32,1);      /* entradas, respuesta a toques */
  --mueve:cubic-bezier(.77,0,.175,1);    /* movimiento en pantalla */
  --cae:cubic-bezier(.55,0,.85,.35);     /* caídas con gravedad */
  /* duraciones */
  --d-toque:140ms; --d-corta:240ms; --d-media:520ms; --d-larga:900ms; --d-escena:1600ms;
  /* trazo */
  --trazo:1.2;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--papel);color:var(--tinta)}
body{font:400 var(--t-2)/1.55 var(--texto);min-height:100svh;overflow-x:clip;

6'/%3E%3Ccircle cx='70.9' cy='2.9' r='0.76'/%3E%3Ccircle cx='174.6' cy='166.9' r='0.64'/%3E%3Ccircle cx='146.9' cy='121.7' r='0.35'/%3E%3C/g%3E%3C/svg%3E");background-size:180px 180px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--morado);outline-offset:4px;border-radius:12px}

/* ===== Parte 1 · contador ===== */
.contador{min-height:100svh;display:grid;place-items:center;align-content:center;gap:var(--e7);padding:var(--e7) var(--e4)}
.fichas{--n:3;--gap:clamp(12px,3.4vw,32px);display:flex;gap:var(--gap);justify-content:center}
.ficha{--w:min(clamp(196px,16vw,232px),calc((100vw - 2*var(--e4) - (var(--n) - 1)*var(--gap)) / var(--n)));width:var(--w);display:grid;justify-items:center;gap:var(--e3)}
.ficha[hidden]{display:none}
.pila{position:relative;width:100%;aspect-ratio:100/124}
.pila>svg,.hoja{position:absolute;inset:0}
.pila>svg{width:100%;height:100%;overflow:visible}
.hoja{display:grid;place-items:center}
.hoja svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.num{position:relative;font:600 calc(var(--w)*.56)/1 var(--mano);letter-spacing:.01em;color:var(--tinta);padding-top:6%;transform:translateX(-3%);font-variant-numeric:tabular-nums}
.etq{margin-top:var(--e2);font-size:var(--t-1);color:var(--tinta-suave);font-style:italic}
/* la hoja que se suelta: gira desde su argolla izquierda y cae */
.hoja.cae{z-index:2;transform-origin:22% 4%;will-change:transform,opacity;animation:cae var(--d-larga) var(--cae) forwards;pointer-events:none}
@keyframes cae{
  0%{transform:none;opacity:1}
  30%{transform:rotate(-9deg);opacity:1}
  100%{transform:translate3d(-4%,115%,0) rotate(-26deg);opacity:0}
}

.boton{position:relative;min-height:56px;min-width:220px;padding:var(--e3) var(--e6);border:0;background:none;cursor:pointer;display:grid;place-items:center;line-height:1.15;transition:transform var(--d-toque) var(--sale)}
.boton svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.boton .b1{position:relative;font:600 var(--t-3)/1 var(--mano)}
.boton .b2{position:relative;font-size:var(--t-1);font-style:italic;color:var(--tinta-suave)}
.boton[aria-disabled=true]{cursor:default;color:var(--tinta-suave)}
.boton:not([aria-disabled=true]){color:var(--papel)}
.boton:not([aria-disabled=true]):active{transform:scale(.97)}
.boton .halo{position:absolute;inset:-10px;border-radius:22px;background:radial-gradient(closest-side,var(--rosado-claro),transparent);opacity:0}
.boton:not([aria-disabled=true]) .halo{animation:respira 2.8s var(--mueve) infinite}
@keyframes respira{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
.aviso{min-height:1.5em;margin:0;font-size:var(--t-1);color:var(--tinta-suave);font-style:italic;text-align:center}

/* ===== Parte 2 · Feliz cumpleaños ===== */
.contador.sale{position:fixed;inset:0;z-index:5;pointer-events:none}
.contador.sale .pila{animation:caeFicha 820ms var(--cae) both;animation-delay:var(--dl,0ms)}
.contador.sale .etq,.contador.sale .boton,.contador.sale .aviso{transition:opacity var(--d-corta) var(--sale);opacity:0}
@keyframes caeFicha{0%{transform:none}22%{transform:translateY(-3%) rotate(var(--rot,-3deg))}100%{transform:translateY(110svh) rotate(calc(var(--rot,-3deg)*7));opacity:.9}}

.portada{position:relative;min-height:100svh;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;--cx:50%;--cy:36%;--gh:min(34svh,62vw,400px)}
.portada[hidden]{display:none}
.capa{position:absolute;pointer-events:none}
.luz{left:var(--cx);top:var(--cy);width:min(170vmin,1300px);aspect-ratio:1;translate:-50% -50%;background:radial-gradient(closest-side,var(--dorado-palido) 0,color-mix(in srgb,var(--rosado-claro) 75%,transparent) 26%,color-mix(in srgb,var(--rosado-claro) 28%,transparent) 58%,transparent 100%);opacity:0;transform:scale(.15)}
.rayos,.anillo,.chispa{left:var(--cx);top:var(--cy);translate:-50% -50%}
.rayos{width:min(125vmax,1250px);aspect-ratio:1;opacity:0}
.anillo{width:min(var(--a),130vmax);aspect-ratio:1;opacity:0}
.chispa{width:56px;aspect-ratio:1;opacity:0}
.rayos svg,.anillo svg,.chispa svg{width:100%;height:100%;overflow:visible}

.arriba{position:relative;z-index:2;display:grid;place-content:center;justify-items:center;gap:var(--e5);padding:var(--e7) var(--e4) var(--e5);text-align:center}
.titulo{margin:0;font:600 clamp(68px,17vw,150px)/.86 var(--mano);color:var(--tinta);position:relative;outline:none}
.titulo .ln{display:block;white-space:nowrap}
.titulo .rell{position:absolute;inset:-.2em -.15em;padding:.2em .15em;opacity:0;-webkit-text-stroke:1.2px var(--tinta);color:transparent;background:linear-gradient(172deg,var(--morado) 20%,var(--rosado-tinta) 95%);-webkit-background-clip:text;background-clip:text}
.titulo .traz{-webkit-text-stroke:1.3px var(--tinta);color:transparent}
.l{display:inline-block;overflow:hidden;padding:0 .06em .12em;margin:0 -.06em -.12em;vertical-align:top;transform:translateX(-101%);opacity:0}
.l>i{display:inline-block;font-style:normal;transform:translateX(101%)}
.frases{margin:0;font-style:italic;font-size:clamp(17px,2.6vw,22px);line-height:1.5;color:var(--tinta-suave);max-width:34ch}
.frases span{display:block;opacity:0;transform:translateY(6px)}

.gente{position:relative;z-index:3;justify-self:center;width:min(100%,1180px);height:var(--gh)}
.pers{position:absolute;bottom:var(--b,0);left:var(--x);height:calc(var(--gh)*var(--h));aspect-ratio:120/200;translate:-50% 0;transform:translateY(175%)}
.pers.atras{z-index:1}.pers.frente{z-index:2}
.pers.cumple{aspect-ratio:160/300;z-index:1}
.salta,.salta svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.portada.ola .salta,.portada.ola .salta svg,.portada.fiesta .cf{will-change:transform,opacity}
.salta .up{opacity:0}
.confeti{inset:0;overflow:hidden;z-index:1;contain:strict}
.cf{position:absolute;top:-24px;left:var(--x);width:var(--w,7px);height:var(--hh,12px);border-radius:2px;background:var(--c);opacity:0}

/* coreografía (el tiempo 0 es el toque en Desbloquear) */
.portada.va .chispa{animation:chispa 1300ms var(--sale) 560ms both}
.portada.va .luz{animation:abreLuz var(--d-escena) var(--sale) 820ms both}
.portada.va .rayos{animation:rayos 2000ms var(--sale) 900ms both}
.portada.va .anillo{animation:anillo 1700ms var(--sale) var(--dl) both}
.portada.va .traz .l,.portada.va .traz .l>i{animation:escribe 220ms var(--mueve) var(--dl) both}
.portada.va .rell{animation:aparece var(--d-media) var(--sale) var(--dr,2700ms) both}
.portada.va .pers{animation:subePers 760ms var(--sale) var(--dl) both}
.portada.va .frases span{animation:frase 700ms var(--sale) var(--dl) both}
.portada.ola .salta{animation:salto 2400ms var(--mueve) var(--do) 2 both}
.portada.ola .salta .up{animation:brazosArriba 2400ms var(--mueve) var(--do) 2 both}
.portada.ola .salta .down{animation:brazosAbajo 2400ms var(--mueve) var(--do) 2 both}
.portada.fiesta .cf{animation:confeti var(--dur) linear var(--dl) 2 both}

@keyframes chispa{0%{opacity:0;transform:scale(0) rotate(-40deg)}35%{opacity:1;transform:scale(1.25) rotate(8deg)}60%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(2.4) rotate(20deg)}}
@keyframes abreLuz{to{opacity:1;transform:none}}
@keyframes rayos{0%{opacity:0;transform:scale(.45) rotate(-10deg)}100%{opacity:1;transform:none}}
@keyframes anillo{0%{opacity:0;transform:scale(.3)}35%{opacity:.75}100%{opacity:var(--fin,.3);transform:none}}
@keyframes escribe{0%{opacity:0}1%,100%{opacity:1}100%{transform:none}}
@keyframes aparece{to{opacity:1}}
@keyframes subePers{to{transform:none}}
@keyframes frase{to{opacity:1;transform:none}}
@keyframes salto{0%,8%,40%,100%{transform:none}20%{transform:translateY(-7%)}}
@keyframes brazosArriba{0%,6%,42%,100%{opacity:0}14%,32%{opacity:1}}
@keyframes brazosAbajo{0%,6%,42%,100%{opacity:1}14%,32%{opacity:0}}
@keyframes confeti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:1;transform:translate3d(var(--dx),108svh,0) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  .contador.sale{transition:opacity 150ms;opacity:0}
  .contador.sale .pila{animation:none}
  .portada.va :is(.luz,.rayos,.traz .l,.traz .l>i,.rell,.pers,.frases span){animation:none;opacity:1;transform:none}
  .portada.va .anillo{animation:none;opacity:var(--fin)}
  .portada.va .chispa{animation:none;opacity:0}
  .portada.ola .salta,.portada.ola .salta *{animation:none}
  .cf{opacity:1;top:var(--y);transform:rotate(var(--r))}
  .portada.fiesta .cf{animation:none}
}

@media (prefers-reduced-motion:reduce){
  .hoja.cae{display:none}
  .boton:not([aria-disabled=true]) .halo{animation:none;opacity:.6}
}
/* ===== Parte 3 · El día ===== */
/* La sección es alta; la escena queda fija (sticky) mientras se desliza.
   En cada cuadro solo cambian transform y opacity de capas propias. */
.dia{position:relative;height:calc(var(--n,20) * 85svh + 100svh)}
.dia[hidden]{display:none}
.escena{position:sticky;top:0;height:100svh;overflow:hidden;contain:strict;--chx:30%}
.escena .c{position:absolute;inset:0;pointer-events:none}
.cielo>i{position:absolute;inset:0}
.c-amanecer{background:linear-gradient(#f7dccb,#fbe7cf 55%,#f9d7c0)}
.c-mediodia{background:linear-gradient(#f8efdc,#fbf3e4 60%,#fdf6e8);opacity:0}
.c-atardecer{background:linear-gradient(#e7a2b5,#f0b39d 50%,#f5c992);opacity:0}
.c-noche{background:linear-gradient(#1c0a24,#2c1036 55%,#3e1849);opacity:0}
.astro{position:absolute;left:0;top:0;will-change:transform}
.sol{width:calc(100svh*.11);aspect-ratio:1}
.sol svg,.luna svg{width:100%;height:100%;overflow:visible}
.rojo{position:absolute;left:50%;top:80%;width:110vmax;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(closest-side,#e8506f 0,rgba(232,80,111,.45) 30%,rgba(240,140,110,.15) 60%,transparent);opacity:0;transform:scale(.3)}
.brillo{position:absolute;left:0;top:0;width:calc(100svh*.5);aspect-ratio:1;translate:-50% -50%;background:radial-gradient(closest-side,rgba(255,214,160,.9),rgba(240,150,120,.35) 45%,transparent);opacity:0}
.estrellas{opacity:0}
.estrellas svg{width:100%;height:62%}
.luna{width:calc(100svh*.07);aspect-ratio:1;opacity:0}
.banda{position:absolute;left:0;bottom:0;height:var(--wh,100%);display:flex;will-change:transform}
.banda svg{height:100%;width:auto;flex:none;display:block}
.est{position:absolute;left:0;bottom:0;height:var(--wh,100%);aspect-ratio:700/1000;will-change:transform}
.est>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pz{position:absolute}
.pz>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.velo{opacity:0}
.velo-tarde{background:#c8506e;mix-blend-mode:normal}
.velo-noche{background:#22082b}
.ella,.perrita{position:absolute;bottom:calc(var(--wh,100svh)*.135);will-change:transform}
.ella{left:var(--chx);height:calc(var(--wh,100svh)*.34);aspect-ratio:160/300;translate:-50% 0;transition:opacity var(--d-larga) var(--sale)}
.perrita{height:calc(var(--wh,100svh)*.1);aspect-ratio:130/90;translate:-50% 0;transition:transform 1100ms var(--sale),opacity var(--d-larga) var(--sale)}
.perrita.concha{left:calc(var(--chx) + var(--wh,100svh)*.17)}
.perrita.mia{left:calc(var(--chx) - var(--wh,100svh)*.13);bottom:calc(var(--wh,100svh)*.115)}
.perrita.concha.adelante{transform:translateX(min(16vw,20svh))}
.ella>svg,.perrita>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;will-change:opacity}
.ella>svg:nth-child(2),.perrita>svg:first-child{opacity:1}
.entra{opacity:0}
/* ellas van delante de las luces; de tarde y de noche se oscurecen con su propia capa (cambia solo en las transiciones) */
.sil{opacity:var(--sil,0)}.sil *{fill:#24092c;stroke:#24092c}
.sombra{position:absolute;left:var(--chx);bottom:calc(var(--wh,100svh)*.125);width:calc(var(--wh,100svh)*.09);height:calc(var(--wh,100svh)*.02);translate:-30% 0;border-radius:50%;background:rgba(74,22,80,.22);transform-origin:20% 50%;will-change:transform,opacity}
.ella.entra{opacity:0;transition:opacity var(--d-larga) var(--sale)}

/* fragmentos escritos en el cielo */
.frags{position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none}
.frag{position:absolute;left:50%;top:10%;width:min(88vw,30ch);translate:-50% 0;margin:0;font:600 clamp(25px,5.6vw,40px)/1.18 var(--mano);color:var(--tinta);text-align:center;text-wrap:balance;opacity:0;transform:translateY(10px);transition:opacity var(--d-corta) var(--sale),transform var(--d-corta) var(--sale)}
.frag.largo{font-size:clamp(22px,4.6vw,34px)}
.frag.m-n{color:var(--papel)}
.frag.vis{opacity:1;transform:none;transition:opacity var(--d-media) var(--sale) 120ms,transform var(--d-larga) var(--sale) 120ms}
.frag cite{font-style:normal;white-space:nowrap}

/* momento actual */
.momentos{position:absolute;left:0;right:0;bottom:3.5%;display:flex;justify-content:center;gap:var(--e5);margin:0;padding:0;list-style:none;font:italic var(--t-1)/1 var(--texto);color:var(--tinta-suave)}
.momentos li{opacity:.55;transition:opacity var(--d-corta)}
.momentos li[aria-current]{opacity:1}
.escena.de-noche .momentos{color:var(--papel)}
.baja{position:absolute;left:50%;bottom:calc(var(--gh) + 10px);width:34px;height:34px;translate:-50% 0;opacity:0;z-index:3}
.baja svg{width:100%;height:100%;overflow:visible}
.portada.va .baja{animation:aparece 700ms var(--sale) 5600ms both,flota 2600ms var(--mueve) 6300ms 3}
@keyframes flota{0%,100%{transform:none}50%{transform:translateY(6px)}}

/* objetos: cada uno se anima solo al llegar su fragmento (clase .on) */
.rayo-ventana{opacity:0}
.on .rayo-ventana{animation:entraLuz 1600ms var(--sale) both}
@keyframes entraLuz{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.girasol{transform-origin:50% 100%;transform:rotate(-28deg);transition:transform 1800ms var(--mueve)}
.on .girasol{transform:rotate(14deg)}
.cajon{transition:transform 900ms var(--sale)}
.on .cajon{transform:translateY(46%)}
.dentro{opacity:0;transform:translateY(30%);transition:opacity 500ms var(--sale) 450ms,transform 700ms var(--sale) 450ms}
.on .dentro{opacity:1;transform:none}
.reparte{opacity:0}
.on .reparte{animation:reparte 1500ms var(--mueve) var(--dl,0ms) both}
@keyframes reparte{0%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.7)}15%{opacity:1}55%{transform:translate(calc(var(--sx)*.45),calc(var(--sy) - 60%)) scale(1)}100%{opacity:1;transform:none}}
.sombra-arbol{transform-origin:40% 50%;transition:transform 1600ms var(--mueve)}
.on .sombra-arbol{transform:scaleX(.18)}
.luz-cocina{opacity:0;transition:opacity 900ms var(--sale) var(--dl,0ms)}
.on .luz-cocina{opacity:1}
.plato-mas{opacity:0;transform:translateX(70%);transition:opacity 500ms var(--sale),transform 1000ms var(--sale)}
.on .plato-mas{opacity:1;transform:none}
.asoma{transform:translateY(70%);transition:transform 900ms var(--sale) 700ms}
.on .asoma{transform:translateY(8%)}
.vapor{opacity:0}
.on .vapor{animation:vapor 2400ms ease-out var(--dl,0ms) 3}
@keyframes vapor{0%{opacity:0;transform:translateY(20%)}30%{opacity:.8}100%{opacity:0;transform:translateY(-40%)}}
.cobija{transform-origin:0 50%;transform:scaleX(.25);transition:transform 1100ms var(--sale) 300ms}
.on .cobija{transform:none}
.pan{opacity:0;transform:scale(.6);transition:opacity 400ms var(--sale) 900ms,transform 600ms var(--sale) 900ms}
.on .pan{opacity:1;transform:none}
.tapa{transform-origin:0 50%;transition:transform 1000ms var(--mueve) 300ms}
.on .tapa{transform:scaleX(0)}
.cerrada{opacity:0;transition:opacity 300ms var(--sale) 1200ms}
.on .cerrada{opacity:1}
.marca{transition:opacity 700ms var(--sale) var(--dl,0ms)}
.on .marca{opacity:0}
.on .rojo-local{animation:aparece 1600ms var(--sale) both}
.ventana-luz{opacity:0;transition:opacity 700ms var(--sale) var(--dl,0ms)}
.on .ventana-luz{opacity:1}
.on .guino{animation:guino 1800ms var(--mueve) 900ms 2 both}
@keyframes guino{0%,100%{opacity:1}20%,30%{opacity:.15}45%{opacity:1}55%{opacity:.3}65%{opacity:1}}
.orbe{transition:transform 2200ms var(--mueve) 300ms}
.on .orbe{transform:translateX(var(--hacia))}
.barrio .tw{animation:tw 3200ms var(--mueve) var(--dl,0ms) infinite;animation-play-state:paused}
.on .barrio .tw{animation-play-state:running}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.foco{opacity:0;transition:opacity 600ms var(--sale)}
.on .foco{opacity:1}
.crece{opacity:0;transform:scale(.15);transition:opacity 900ms var(--sale),transform 2400ms var(--sale)}
.on .crece{opacity:1;transform:none}
.camino-luz{opacity:0;transform:scaleX(.1);transform-origin:0 50%;transition:opacity 800ms var(--sale) 900ms,transform 2200ms var(--sale) 900ms}
.on .camino-luz{opacity:1;transform:none}
.lampara{opacity:0;transition:opacity 900ms var(--sale) 300ms}
.on .lampara{opacity:1}

@media (prefers-reduced-motion:reduce){
  .frag,.frag.vis,.perrita,.ella{transition:none}
  .on *,.on{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  .barrio .tw{animation:none}
  .portada.va .baja{animation:none;opacity:1}
}

/* ===== Parte 4 · La carta ===== */
.carta{position:relative;background:linear-gradient(#3e1849,#2c1036 30%,#1c0a24);padding:clamp(48px,10vh,120px) var(--e4) clamp(64px,12vh,140px);display:grid;justify-items:center;gap:var(--e6)}
.carta[hidden]{display:none}
.carta .cielo-c{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.carta .cielo-c svg{width:100%;height:100%}
.hoja-c{--lh:clamp(36px,6.4vw,44px);position:relative;width:min(100%,640px);margin:0;padding:calc(var(--lh)*1.4) clamp(20px,6vw,56px) calc(var(--lh)*1.6) clamp(60px,13vw,96px);
  background-color:var(--papel);background-image:linear-gradient(90deg,transparent calc(clamp(60px,13vw,96px) - 14px),rgba(224,123,160,.55) calc(clamp(60px,13vw,96px) - 14px),rgba(224,123,160,.55) calc(clamp(60px,13vw,96px) - 12px),transparent calc(clamp(60px,13vw,96px) - 12px)),repeating-linear-gradient(transparent 0,transparent calc(var(--lh) - 1px),rgba(138,58,143,.13) calc(var(--lh) - 1px),rgba(138,58,143,.13) var(--lh));
  background-position:0 0,0 calc(var(--lh)*1.4 + 6px);
  rotate:-.6deg;box-shadow:0 18px 40px rgba(10,0,14,.45),0 2px 0 rgba(10,0,14,.2)}
.hoja-c>svg.borde{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cinta{position:absolute;top:-14px;left:50%;width:96px;height:28px;translate:-50% 0;rotate:3deg;background:rgba(246,201,216,.78)}
.estrofa{position:relative;margin:0 0 var(--lh)}
.estrofa:last-of-type{margin-bottom:0}
.estrofa p{margin:0;font:600 clamp(19px,3.7vw,26px)/var(--lh) var(--mano);color:var(--tinta)}
.estrofa .v{display:block;padding-left:1.1em;text-indent:-1.1em;opacity:0;transform:translateY(8px);transition:opacity var(--d-media) var(--sale) var(--dl,0ms),transform var(--d-larga) var(--sale) var(--dl,0ms)}
.estrofa.on .v{opacity:1;transform:none}
.dib{position:absolute;left:calc(clamp(60px,13vw,96px) * -1 + 4px);top:2px;width:calc(clamp(60px,13vw,96px) - 22px);aspect-ratio:1;opacity:0;transform:scale(.9) rotate(-3deg);transition:opacity var(--d-larga) var(--sale) 200ms,transform var(--d-larga) var(--sale) 200ms}
.estrofa.on .dib{opacity:1;transform:none}
.dib>.pz{position:absolute}
.dib svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* cada dibujo se anima una vez al llegar a su estrofa */
.estrofa.on .faro{animation:faro 2600ms var(--mueve) 600ms 2}
@keyframes faro{0%,100%{opacity:1;transform:none}50%{opacity:.55;transform:scale(1.25)}}
.estrofa.on .barco{animation:barco 3400ms var(--mueve) 500ms both}
@keyframes barco{0%{transform:none}45%{transform:translateX(-46%) scale(.8)}100%{transform:none}}
.estrofa.on .ventana-c{animation:aparece 900ms var(--sale) 2800ms both}
.ventana-c{opacity:0}
.nota{opacity:0}
.estrofa.on .nota{animation:nota 2600ms var(--sale) var(--dl,0ms) 2}
@keyframes nota{0%{opacity:0;transform:translate(0,10%)}30%{opacity:1}100%{opacity:0;transform:translate(-30%,-55%)}}
.puerta-c{transform-origin:0 50%;transition:transform 1400ms var(--mueve) 700ms}
.estrofa.on .puerta-c{transform:scaleX(.32)}

.volver:hover{opacity:1}
.volver:active{transform:scale(.97)}
.cortina{position:fixed;inset:0;background:#1c0a24;opacity:0;pointer-events:none;z-index:20;transition:opacity 320ms var(--sale)}
.cortina.on{opacity:1}

  .estrofa.on *{animation:none!important}
  .estrofa.on .puerta-c{transition:none}
  .ventana-c,.nota{opacity:1}
  .cortina{transition:none}
}

<script>
{
/* ---------- ajustes de prueba ----------
   ?abierto=1 (o #abierto): activa el botón. NO es seguridad: el repo es público.
   ?faltan=SEGUNDOS: cambia la cuenta simulada (por defecto 2 horas). */
const q=new URLSearchParams(location.search), h=location.hash;
const ABIERTO=q.get('abierto')==='1'||/abierto/.test(h);
const faltan=Number(q.get('faltan')||(h.match(/faltan-(\d+)/)||[])[1]||7200);
const META=Date.now()+faltan*1000;
const quieto=matchMedia('(prefers-reduced-motion: reduce)');
const NS='http://www.w3.org/2000/svg';
const css=getComputedStyle(document.documentElement);
const tok=n=>css.getPropertyValue(n).trim();
const TINTA=tok('--tinta'),PAPEL2=tok('--papel-2'),MORADO=tok('--morado'),SUAVE=tok('--tinta-suave');
const TRAZO=parseFloat(tok('--trazo'));

/* crayón: una pasada firme y otra con grano (trazo cortado), siempre con la misma semilla */
function crayon(svg,forma,args,o,grano=true){
  const rc=rough.svg(svg),base={stroke:TINTA,strokeWidth:TRAZO,roughness:.9,bowing:.6,...o};
  const a=rc[forma](...args,base);svg.append(a);if(!grano)return;
  const b=rc[forma](...args,{...base,fill:undefined,seed:(base.seed||1)+97,strokeWidth:TRAZO*.9,roughness:1.6});
  b.querySelectorAll('path').forEach(p=>{p.setAttribute('stroke-dasharray','1.4 2.1');p.setAttribute('opacity','.7')});
  svg.append(b);
}
function lienzo(vb){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',vb);s.setAttribute('aria-hidden','true');return s}

/* hoja: papel, contorno a mano y dos argollas arriba */
function hoja(){
  const d=document.createElement('div');d.className='hoja';
  const s=lienzo('0 0 100 124');
  crayon(s,'rectangle',[3,8,94,113],{fill:PAPEL2,fillStyle:'solid',seed:11});
  [30,70].forEach((x,i)=>crayon(s,'ellipse',[x,7,6,11],{seed:21+i,strokeWidth:TRAZO*1.1}));
  const n=document.createElement('span');n.className='num';n.textContent='00';
  d.append(s,n);return d;
}
/* cartas apiladas detrás: se dibujan una vez y no se repintan */
function pila(){
  const s=lienzo('0 0 100 124');
  [[6,6,-3.4,31,.4],[3,3,1.8,41,.65]].forEach(([dx,dy,r,seed,op])=>{
    const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${dx} ${dy}) rotate(${r} 50 62)`);g.setAttribute('opacity',op);
    crayon(g,'rectangle',[3,8,94,113],{fill:PAPEL2,fillStyle:'solid',seed,stroke:SUAVE},false);s.append(g);
  });return s;
}

const fichas={};
document.querySelectorAll('.ficha').forEach(f=>{
  const p=f.querySelector('.pila'),hj=hoja();p.append(pila(),hj);
  fichas[f.dataset.u]={f,p,hj,num:hj.querySelector('.num'),v:null};
});

function cambia(u,v){
  const F=fichas[u];if(F.v===v)return;
  const anima=F.v!==null&&!quieto.matches&&!document.hidden;
  if(anima){
    const vieja=F.hj.cloneNode(true);vieja.classList.add('cae');
    vieja.addEventListener('animationend',()=>vieja.remove(),{once:true});
    F.p.append(vieja);
  }
  F.v=v;F.num.textContent=String(v).padStart(2,'0');
}

const falta=document.getElementById('falta');
let ultimoMin=-1,detenido=false;
function tick(){
  if(detenido)return;
  const resta=Math.max(0,META-Date.now()),r=Math.ceil(resta/1000);
  const d=Math.floor(r/86400),hh=Math.floor(r%86400/3600),mm=Math.floor(r%3600/60),ss=r%60;
  const conDias=d>0;fichas.d.f.hidden=!conDias;
  document.querySelector('.fichas').style.setProperty('--n',conDias?4:3);
  if(conDias)cambia('d',d);cambia('h',hh);cambia('m',mm);cambia('s',ss);
  const minTot=r?Math.floor(r/60):-2;
  if(minTot!==ultimoMin){ultimoMin=minTot;
    const pl=(n,a,b)=>n+' '+(n===1?a:b);
    falta.textContent=r?'Faltan '+[conDias&&pl(d,'día','días'),pl(hh,'hora','horas'),pl(mm,'minuto','minutos')].filter(Boolean).join(', '):'La cuenta está en cero.';}
  if(r>0)setTimeout(tick,(resta%1000||1000)+8);
}
tick();

/* botón */
const btn=document.getElementById('desbloquear'),aviso=document.getElementById('aviso');
const bs=lienzo('0 0 240 60');bs.setAttribute('preserveAspectRatio','none');
crayon(bs,'rectangle',[4,4,232,52],ABIERTO?{fill:MORADO,fillStyle:'solid',seed:5}:{seed:5,stroke:SUAVE,strokeLineDash:[6,7]},!ABIERTO?false:true);
btn.prepend(bs);
if(ABIERTO){btn.removeAttribute('aria-disabled');btn.querySelector('.b2').remove();}

/* ===================== Parte 2 · Feliz cumpleaños ===================== */
const portada=document.getElementById('portada'),titulo=document.getElementById('titulo');
const C={dorado:tok('--dorado'),dpal:tok('--dorado-palido'),rosado:tok('--rosado'),rcl:tok('--rosado-claro'),rt:tok('--rosado-tinta')};
let armada=false;
function armaPortada(){
  if(armada)return;armada=true;
  /* título letra por letra: la ventana de cada letra avanza y la descubre, como un trazo */
  const tz=portada.querySelector('.traz');let i=0;
  ['Feliz','cumpleaños'].forEach(w=>{
    const ln=document.createElement('span');ln.className='ln';
    [...w].forEach(ch=>{const l=document.createElement('span');l.className='l';
      const d=1250+i*78+(i>4?140:0);l.style.setProperty('--dl',d+'ms');
      const it=document.createElement('i');it.textContent=ch;it.style.setProperty('--dl',d+'ms');l.append(it);ln.append(l);i++});
    tz.append(ln);
  });
  portada.querySelector('.rell').style.setProperty('--dr',(1250+i*78+260)+'ms');
  /* rayos y anillos: dibujados una vez */
  const rs=lienzo('-100 -100 200 200');
  for(let k=0;k<24;k++){const a=k/24*Math.PI*2+(k%2)*.05,r1=33+(k%3)*2,r2=46+((k*7)%5)*4;
    const ln=rough.svg(rs).line(Math.cos(a)*r1,Math.sin(a)*r1,Math.cos(a)*r2,Math.sin(a)*r2,{stroke:k%2?C.rosado:C.dorado,strokeWidth:.16,roughness:.6,seed:k+3});ln.setAttribute('opacity','.75');rs.append(ln)}
  portada.querySelector('.rayos').append(rs);
  portada.querySelectorAll('.anillo').forEach((el,k)=>{const sv=lienzo('-50 -50 100 100');sv.append(rough.svg(sv).circle(0,0,96,{stroke:k%2?C.dorado:C.rosado,strokeWidth:.22,roughness:1.1,seed:50+k}));el.append(sv)});
  const ch=lienzo('-30 -30 60 60');
  ch.append(rough.svg(ch).path('M0 -26 Q4 -4 26 0 Q4 4 0 26 Q-4 4 -26 0 Q-4 -4 0 -26Z',{fill:C.dpal,fillStyle:'solid',stroke:C.dorado,strokeWidth:1.4,roughness:.7,seed:9}));
  portada.querySelector('.chispa').append(ch);
  gente();confeti();
  const bj=lienzo('0 0 34 34');D(bj,'path',['M6 12 L17 24 L28 12'],{strokeWidth:2.4,stroke:tok('--tinta-suave'),seed:3});portada.querySelector('.baja').append(bj);
}

/* ---------- la gente ---------- */
/* tonos de piel: el de ella (#d9a57c) y matices alrededor */
const PIEL=['#e6bb94','#d9a57c','#c9946d','#efc9a5','#cf9c74','#bd8862','#e0b08a'];
const PELO={negro:'#30201a',cafe:'#4a3024',castano:'#5e3d2a',gris:'#a39a94',blanco:'#d8d2cc'};
const ROPA=[tok('--morado'),tok('--rosado'),tok('--dorado'),tok('--rosado-claro'),tok('--tinta-suave'),'#c98fb0','#b8a0d2',tok('--dorado-palido')];
/* x en % del ancho; h = altura relativa; fila; piel; pelo; color de pelo; ropa; cuerpo; extra; en celular se oculta si oc */
const GENTE=[
 {x:7, h:.80,f:'atras',p:3,pelo:'moño',pc:'gris',r:1,c:'vestido',e:'chal',edad:'mayor'},
 {x:16,h:.88,f:'atras',p:5,pelo:'corto',pc:'blanco',r:4,c:'camisa',e:'sombrero',edad:'mayor'},
 {x:27,h:.86,f:'atras',p:1,pelo:'largo',pc:'negro',r:0,c:'vestido',e:'flores',oc:1},
 {x:39,h:.94,f:'atras',p:4,pelo:'rizado',pc:'negro',r:2,c:'camisa',e:''},
 {x:50,h:.98,f:'atras',ella:1}, // la cumpleañera, al centro, con el gorro más bonito
 {x:61,h:.84,f:'atras',p:0,pelo:'largo',pc:'castano',r:5,c:'vestido',e:'globo'},
 {x:72,h:.90,f:'atras',p:6,pelo:'corto',pc:'negro',r:0,c:'camisa',e:'',oc:1},
 {x:83,h:.82,f:'atras',p:5,pelo:'moño',pc:'negro',r:3,c:'vestido',e:'aretes'},
 {x:93,h:.86,f:'atras',p:2,pelo:'corto',pc:'gris',r:7,c:'camisa',e:'baston',edad:'mayor'},
 {x:12,h:.50,f:'frente',p:4,pelo:'coletas',pc:'negro',r:1,c:'vestido',e:'globo',nino:1},
 {x:33,h:.44,f:'frente',p:0,pelo:'corto',pc:'castano',r:2,c:'camisa',e:'',nino:1},
 {x:45,h:.36,f:'frente',p:6,pelo:'rizado',pc:'cafe',r:5,c:'vestido',e:'',nino:1,oc:1},

];
function figura(P,modo,seed){
  const arriba=modo==='arriba',brazos=modo!=='cuerpo',cuerpo=modo==='cuerpo';
  /* lienzo 120×200, pies en y=196. Devuelve un svg con la figura (con brazos abajo o arriba) */
  const sv=lienzo('0 0 120 200');const rc=rough.svg(sv);
  const H=190*(P.e==='hombros'?.92:1),x=60,suelo=196,top=suelo-H;
  const r=H*(P.nino?.15:.105),cy=top+r+2,hombro=cy+r*1.35,cadera=suelo-H*(P.nino?.36:.42);
  const sw=r*(P.nino?.95:1.05),piel=PIEL[P.p],pelo=PELO[P.pc],ropa=ROPA[P.r],o={stroke:TINTA,strokeWidth:1.1,roughness:.9,bowing:.5,seed};
  const add0=n=>sv.append(n);const add=n=>{if(cuerpo)add0(n)};const addB=n=>{if(brazos)add0(n)};const sol=(c,ex={})=>({...o,fill:c,fillStyle:'solid',...ex});

  [-1,1].forEach(l=>{const [mx,my]=mano(l);addB(rc.line(x+l*sw*.75,hombro+2,mx,my,{...o,strokeWidth:1.4}));addB(rc.circle(mx,my,r*.42,sol(piel,{strokeWidth:.8})))});

  D(sv,'ellipse',[62,56,84,40],F_(c1,{seed:semilla+6}));
  for(let i=0;i<6;i++)D(sv,'line',[34+i*11,66,32+i*11,78],{stroke:c1,strokeWidth:2.2,seed:semilla+7+i});
  perroCara(sv,104,40,c2,c1,.62);
  return sv;
}
/* ---------- medidas (solo al cambiar el tamaño) ---------- */
let W=0,H=0,u=1,topDia=0,largo=1,chx=.22;
function medir(){
  W=escena.clientWidth;H=escena.clientHeight;u=Math.min(H/1000,W/540);escena.style.setProperty('--wh',(1000*u).toFixed(1)+'px');
  const r=dia.getBoundingClientRect();topDia=r.top+scrollY;largo=Math.max(1,dia.offsetHeight-H);
  chx=.30;
  pinta(true);
}
const camEn=k=>((k===18?17:k)*SW+350)*u-(.66)*W+(chx-.22)*W*.3; // N6 ocurre en la misma casita de N5: la cámara no se mueve

/* ---------- estaciones: se construyen cerca del recorrido ---------- */
const estaciones=[];
function construye(k){
  if(k<0||k>=NF||estaciones[k])return;
  const E=div('est',mundo),L=div('est',luces);E.style.display=L.style.display='none';
  const sv=lienzo('0 0 700 1000');E.append(sv);
  EST[k](sv,E,L);
  estaciones[k]={E,L,vis:false,on:false};
}
function construyeCerca(k){for(let j=k-1;j<=k+2;j++)construye(j)}

/* ---------- el cuadro ---------- */
const lerp=(a,b,x)=>a+(b-a)*x,cl=x=>Math.max(0,Math.min(1,x)),rampa=(f,a,b)=>cl((f-a)/(b-a));
const suave=x=>x*x*(3-2*x);
const SOL=[[0,10,60],[2.5,28,38],[5.5,50,26],[6.5,58,44],[9,64,56],[11.5,68,69],[12.5,70,86],[13.2,70,94]];
function solEn(f){for(let i=1;i<SOL.length;i++){if(f<=SOL[i][0]){const a=SOL[i-1],b=SOL[i],x=suave(cl((f-a[0])/(b[0]-a[0])));return[lerp(a[1],b[1],x),lerp(a[2],b[2],x)]}}return SOL[SOL.length-1].slice(1)}
let ultimo={},activo=-2,frag=-1,cuadros=null,recorrido=0,quieta=99,camPrev=null,fSuave=null,bucle=0,tPrev=0;
const fijo=(el,k,v)=>{if(ultimo[k]!==v){ultimo[k]=v;el.style[k.split('|')[0]]=v}};
function pasos(q,n){if(!cuadros||ultimo['p'+q]===n)return;const prev=ultimo['p'+q];ultimo['p'+q]=n;cuadros[q][n].style.opacity=1;if(prev!=null&&prev!==n)cuadros[q][prev].style.opacity=0}
const VIAJE=.55,LLEGA=.5; // cada tramo: camina el 55 %, el texto aparece al 50 % (casi llegando)
const suave5=x=>x*x*x*(x*(x*6-15)+10);
function objetivo(){return Math.min(cl((scrollY-topDia)/largo)*NF,NF-.0001)}
function pinta(forzar){
  if(!diaArmado||dia.hidden)return;
  const red=quieto.matches;
  const f=fSuave==null||red?objetivo():fSuave;
  const k=Math.floor(f),fr=f-k;
  // cámara: se mueve continua y suave hacia la estación de cada tramo
  const c0=k?camEn(k-1):camEn(0)-260*u,c1=camEn(k);
  const viaje=fr<VIAJE;
  const cam=red?(fr<LLEGA?c0:c1):(viaje?lerp(c0,c1,suave5(fr/VIAJE)):c1);
  const fs=red?(fr<LLEGA?Math.max(0,k-.01):k+.6):f; // en movimiento reducido el cielo salta entre paradas
  construyeCerca(k);
  // estaciones: se muestran un poco antes de entrar, para que el dibujo ya esté listo
  estaciones.forEach((S,j)=>{if(!S)return;const sx=j*SW*u-cam,ve=sx<W*1.35&&sx>-W*.6-SW*u;
    if(ve!==S.vis){S.vis=ve;S.E.style.display=S.L.style.display=ve?'':'none'}
    if(ve){const t=`translate3d(${sx.toFixed(1)}px,0,0)`;if(S.t!==t){S.t=t;S.E.style.transform=S.L.style.transform=t}}
    const on=j<k||(j===k&&fr>=LLEGA);if(on!==S.on){S.on=on;S.E.classList.toggle('on',on);S.L.classList.toggle('on',on)}});
  bandas.forEach((B,i)=>{const bw=B.ancho*u;const t=-(((cam+400*u)*B.par)%bw+bw)%bw;fijo(B.b,'transform|b'+i,`translate3d(${t.toFixed(1)}px,0,0)`)});
  // cielo
  fijo(capas.mediodia,'opacity|m',rampa(fs,.3,4).toFixed(3));
  fijo(capas.atardecer,'opacity|a',rampa(fs,6,6.5).toFixed(3));
  fijo(capas.noche,'opacity|n',rampa(fs,13.05,13.5).toFixed(3));
  const [sxp,syp]=solEn(fs);
  fijo(sol,'transform|s',`translate3d(${(sxp/100*W-.055*H).toFixed(1)}px,${(syp/100*H-.055*H).toFixed(1)}px,0)`);
  fijo(rojo,'opacity|r',(rampa(fs,10.9,11.6)*(1-rampa(fs,12.9,13.4))).toFixed(3));fijo(rojo,'transform|rt',`scale(${(.3+.7*rampa(fs,10.9,12)).toFixed(3)})`);
  fijo(brillo,'transform|bt',`translate3d(${(70/100*W).toFixed(0)}px,${(.72*H).toFixed(0)}px,0)`);
  fijo(brillo,'opacity|bo',(rampa(fs,11.7,12.4)*(1-rampa(fs,13.05,13.5))).toFixed(3));
  const no=rampa(fs,13.05,13.7);fijo(luna,'opacity|lo',no.toFixed(3));fijo(estrellas,'opacity|eo',no.toFixed(3));
  fijo(veloT,'opacity|vt',(.13*rampa(fs,6,6.5)*(1-rampa(fs,13.05,13.5))).toFixed(3));
  fijo(veloN,'opacity|vn',(.6*rampa(fs,13.05,13.5)).toFixed(3));
  const sil=(.1*rampa(fs,6,6.5)+.45*rampa(fs,13.05,13.5)).toFixed(2);if(ultimo.sil!==sil){ultimo.sil=sil;[ella,perrita,otra].forEach(e=>e.style.setProperty('--sil',sil))}
  const bajo=cl((syp-11)/50);fijo(sombra,'transform|so',`scaleX(${(.12+.88*bajo).toFixed(3)})`);fijo(sombra,'opacity|soo',(1-rampa(fs,12,12.6)).toFixed(2));
  // la perrita se adelanta desde S3; en N7 entran a casa
  const ade=k>2||(k===2&&fr>=LLEGA);if(ultimo.ade!==ade){ultimo.ade=ade;perrita.classList.toggle('adelante',ade)}
  const casa=k===NF-1&&fr>=LLEGA;if(ultimo.casa!==casa){ultimo.casa=casa;[ella,perrita,otra].forEach(e=>e.classList.toggle('entra',casa))}
  // fragmento visible y momento
  const nf=fr>=LLEGA?k:(fr<.05&&k>0?k-1:-1);
  if(nf!==frag){if(frag>=0)frags.children[frag].classList.remove('vis');if(nf>=0)frags.children[nf].classList.add('vis');frag=nf}
  const mo=k<6?0:k<13?1:2;if(mo!==activo){activo=mo;momentos.forEach((li,i)=>i===mo?li.setAttribute('aria-current','step'):li.removeAttribute('aria-current'));escena.classList.toggle('de-noche',mo===2)}
  // camina solo mientras la cámara se mueve
  // los pasos siguen a la distancia recorrida (no a un reloj): no hay parpadeo al parar y seguir
  const mov=camPrev===null?0:Math.abs(cam-camPrev);camPrev=cam;
  if(!red&&!forzar&&mov>.2){recorrido+=mov;quieta=0}else quieta++;
  const anda=quieta<6;
  pasos('ella',anda?[0,1,2,1][Math.floor(recorrido/(22*u))%4]:1);
  pasos('concha',anda?Math.floor(recorrido/(14*u))%2:0);pasos('mia',anda?Math.floor(recorrido/(14*u)+1)%2:0);
}
/* el día sigue al dedo con un poco de inercia: cada cuadro se acerca al punto real */
function cuadro(t){
  const dt=Math.min(64,t-(tPrev||t));tPrev=t;
  const obj=objetivo();if(fSuave==null)fSuave=obj;
  fSuave+=(obj-fSuave)*(1-Math.exp(-dt/110));
  if(Math.abs(obj-fSuave)<.0004)fSuave=obj;
  pinta();
  bucle=fSuave!==obj?requestAnimationFrame(cuadro):0;
  if(!bucle){tPrev=0;quieta=99;pasos('ella',1);pasos('concha',0);pasos('mia',0)}
}
addEventListener('scroll',()=>{if(quieto.matches){pinta();return}if(!bucle)bucle=requestAnimationFrame(cuadro)},{passive:true});
addEventListener('resize',()=>{if(diaArmado)medir()});
quieto.addEventListener('change',()=>pinta(true));

/* ===================== Parte 4 · La carta ===================== */
const CARTA=[["Hay un camino largo que da la vuelta al mar", "y siempre termina en una luz encendida.", "Quien lo anda no va solo:", "lleva el nombre de alguien en la boca."], ["De los que vuelven aprendí", "que un viaje no se mide en islas,", "se mide en las ganas de llegar a casa.", "Y de los que esperan, que esperar", "también es una forma de caminar."], ["No volteo a comprobar que me sigues.", "Quien camina de frente confía", "en la música que suena detrás.", "Esa música es tu paso."], ["De noche duermo, y algo en mí sigue despierto:", "un jardín con la puerta abierta.", "Adonde vayas, ahí queda mi casa."]];
const carta=document.getElementById('carta');
let cartaArmada=false;
function dib(cont,x,y,w,h,cls,dibuja){ // pieza dentro de un dibujo de 120×120
  const d=div('pz '+(cls||''),cont);d.style.cssText=`left:${x/1.2}%;top:${y/1.2}%;width:${w/1.2}%;height:${h/1.2}%`;
  const sv=lienzo(`0 0 ${w} ${h}`);dibuja(sv);d.append(sv);return d;
}
const MAR='#b8a0d2',o1={strokeWidth:1.3};
const DIBUJOS=[
 /* 1 · camino que da la vuelta al mar y termina en una luz */
 c=>{dib(c,0,0,120,120,'',s=>{D(s,'path',['M4 70 Q30 60 60 66 Q92 72 116 62 L116 116 L4 116Z'],F_(MAR,{...o1,seed:701}));
     [84,96].forEach((y,i)=>D(s,'path',[`M14 ${y} Q24 ${y-5} 34 ${y} Q44 ${y+5} 54 ${y} Q64 ${y-5} 74 ${y}`],{...o1,stroke:'#fbf3e4',seed:702+i}));
     D(s,'path',['M6 112 Q2 60 40 46 Q80 32 104 40'],{strokeWidth:3,stroke:K.madera2,seed:704});
     D(s,'rectangle',[100,22,10,22],F_(K.muro,{...o1,seed:705}))});
   dib(c,92,6,26,26,'faro',s=>D(s,'circle',[13,13,20],F_(K.luz,{...o1,stroke:C.dorado,seed:706})))},
 /* 2 · un barco que se aleja y vuelve; una ventana con luz que lo espera */
 c=>{dib(c,0,0,120,120,'',s=>{D(s,'path',['M0 92 Q20 86 40 92 Q60 98 80 92 Q100 86 120 92'],{...o1,stroke:MAR,strokeWidth:2,seed:711});
     D(s,'rectangle',[84,40,30,36],F_(K.muro,{...o1,seed:712}));D(s,'polygon',[[[80,42],[99,26],[118,42]]],F_(K.techo,{...o1,seed:713}));
     D(s,'rectangle',[92,50,14,14],F_(K.vidrio,{...o1,seed:714}))});
   dib(c,92,50,14,14,'ventana-c',s=>D(s,'rectangle',[1,1,12,12],F_(K.luz,{...o1,seed:715})));
   dib(c,30,48,46,46,'barco',s=>{D(s,'path',['M4 32 L42 32 L36 42 L10 42Z'],F_(K.madera,{...o1,seed:716}));D(s,'line',[22,32,22,4],{...o1,seed:717});D(s,'polygon',[[[23,6],[23,28],[40,28]]],F_('#fbf3e4',{...o1,seed:718}))})},
 /* 3 · alguien camina de frente y detrás suena una música suave */
 c=>{dib(c,0,0,120,120,'',s=>{D(s,'line',[10,108,112,108],{...o1,stroke:K.madera2,seed:721});
     D(s,'circle',[78,40,18],F_('#d9a57c',{...o1,seed:722}));D(s,'path',['M70 50 L86 50 L90 82 L66 82Z'],F_(K.vestido,{...o1,seed:723}));
     D(s,'line',[72,82,70,106],{...o1,stroke:'#5f76a8',strokeWidth:4,seed:724});D(s,'line',[84,82,88,106],{...o1,stroke:'#5f76a8',strokeWidth:4,seed:725})});
   [[22,40,0],[36,22,700],[12,16,1400]].forEach(([x,y,dl],i)=>{const n=dib(c,x,y,22,26,'nota',s=>{D(s,'ellipse',[7,20,11,8],F_(C.rosado,{...o1,seed:726+i}));D(s,'line',[12,20,12,3],{...o1,seed:729+i});if(i!==1)D(s,'line',[12,3,19,7],{...o1,seed:732+i})});n.style.setProperty('--dl',dl+'ms')})},
 /* 4 · un jardín de noche con la puerta abierta */
 c=>{dib(c,0,0,120,120,'',s=>{D(s,'circle',[100,18,14],F_('#fbf3e4',{...o1,stroke:C.dorado,seed:741}));
     for(let i=0;i<5;i++){const x=8+i*9;D(s,'line',[x,104,x,70],{...o1,stroke:K.madera,seed:742+i})}D(s,'line',[4,78,50,78],{...o1,stroke:K.madera,seed:747});
     for(let i=0;i<4;i++){const x=78+i*11;D(s,'line',[x,104,x,72],{...o1,stroke:K.madera,seed:748+i})}D(s,'line',[74,80,116,80],{...o1,stroke:K.madera,seed:752});
     [[16,62],[30,58],[96,64],[110,60]].forEach(([x,y],i)=>D(s,'circle',[x,y,10],F_(i%2?C.rosado:K.petalo,{...o1,seed:753+i})));
     D(s,'line',[4,106,116,106],{...o1,stroke:K.tallo,seed:757})});
   dib(c,52,66,24,40,'puerta-c',s=>{D(s,'rectangle',[1,1,22,38],F_(K.madera2,{...o1,seed:758}));D(s,'line',[1,14,23,14],{...o1,seed:759});D(s,'line',[1,28,23,28],{...o1,seed:760})})},
];
function armaCarta(){
  if(cartaArmada)return;cartaArmada=true;
  const cs=lienzo('0 0 1000 1000');cs.setAttribute('preserveAspectRatio','xMidYMid slice');
  for(let i=0;i<34;i++){const x=(i*293)%1000,y=(i*131)%1000;D(cs,'circle',[x,y,i%5?3:5],F_('#fbf3e4',{...SIN,roughness:.3,seed:800+i}))}
  carta.querySelector('.cielo-c').append(cs);
  const hoja=carta.querySelector('.hoja-c');
  const bs=lienzo('0 0 100 100');bs.setAttribute('preserveAspectRatio','none');bs.classList.add('borde');
  bs.append(rough.svg(bs).rectangle(.4,.3,99.2,99.4,{stroke:'#c9b59a',strokeWidth:.6,roughness:.5,seed:810}));
  hoja.prepend(bs);
  CARTA.forEach((lineas,i)=>{
    const e=document.createElement('div');e.className='estrofa';
    const p=document.createElement('p');
    lineas.forEach((t,j)=>{const v=document.createElement('span');v.className='v';v.textContent=t;v.style.setProperty('--dl',(j*140)+'ms');p.append(v)});
    const d=div('dib',null);d.setAttribute('aria-hidden','true');DIBUJOS[i](d);
    e.append(p,d);hoja.append(e);
  });
  // cada estrofa aparece al llegar a ella y se queda
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('on');io.unobserve(en.target)}}),{threshold:.45});
  hoja.querySelectorAll('.estrofa').forEach(e=>io.observe(e));
  // volver al inicio del día: se cubre un instante, salta y se descubre (sin recorrer todo el día de golpe)
  const cort=document.querySelector('.cortina');
  carta.querySelector('.volver').addEventListener('click',()=>{
    const salta=()=>{medir();scrollTo({top:topDia,behavior:'instant'});fSuave=null;pinta(true);cort.classList.remove('on')};
    if(quieto.matches){salta();return}
    cort.classList.add('on');setTimeout(salta,340);
  });
}

btn.addEventListener('click',()=>{
  if(btn.getAttribute('aria-disabled')==='true'||armada&&!portada.hidden)return;

if(ABIERTO)(window.requestIdleCallback||setTimeout)(()=>{armaPortada();(window.requestIdleCallback||setTimeout)(armaDia)});

if(ABIERTO&&(q.get('fase')==='portada'||/portada/.test(h)))abrir(true);
/* ?fase=dia&f=7.5 (con abierto): salta al día en ese punto, solo para pruebas */
/* ?fase=carta (con abierto): salta a la carta, solo para pruebas */
if(ABIERTO&&q.get('fase')==='carta'){abrir(true);requestAnimationFrame(()=>carta.scrollIntoView())}

}
